<!-- @dsCard group="Foundations" name="Motion, radii & elevation" subtitle="Springy ease · 8–18px radii · flat Scandinavian shadows" -->
<!doctype html>
<meta charset="utf-8">
<title>Ragnarök — Motion, radii & elevation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box}
  body{margin:0;background:#22272E;color:#ECEFF4;padding:26px;font-family:'Inter',system-ui,sans-serif}
  h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#727C8D;font-weight:600;margin:0 0 12px}
  section{margin-bottom:26px}
  .mono{font-family:'JetBrains Mono',monospace}
  .radii{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .radii .box{width:74px;height:74px;background:#3B4252;border:1px solid #434C5E;display:flex;align-items:flex-end;justify-content:center;padding:6px}
  .radii .box span{font-family:'JetBrains Mono',monospace;font-size:10px;color:#AEB6C4}
  .shadows{display:flex;gap:20px;flex-wrap:wrap}
  .shadows .card{width:120px;height:74px;background:#2E3440;border:1px solid #39414F;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#88C0D0}
  .s1{box-shadow:0 1px 2px rgba(0,0,0,.28)}
  .s2{box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
  .s3{box-shadow:0 14px 30px -16px rgba(0,0,0,.55)}
  .motion{display:flex;gap:14px;flex-wrap:wrap}
  .btn{border:1px solid #434C5E;background:#2E3440;color:#ECEFF4;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;
       transition:border-color .14s cubic-bezier(.16,1,.3,1),color .14s cubic-bezier(.16,1,.3,1),transform .14s cubic-bezier(.16,1,.3,1)}
  .btn:hover{border-color:#81A1C1;color:#88C0D0}
  .btn:active{transform:translateY(1px)}
  .btn.warm:hover{border-color:#4E4632;color:#E6C583}
  .tokline{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#AEB6C4;line-height:1.9}
  .tokline b{color:#E6C583;font-weight:500}
</style>
<section>
  <h2>Motion</h2>
  <div class="tokline">
    --ease &nbsp; <b>cubic-bezier(.16, 1, .3, 1)</b> &nbsp; soft, "expensive" deceleration<br>
    --dur-1 &nbsp; <b>.14s</b> &nbsp; instant feedback: hover, color<br>
    --dur-2 &nbsp; <b>.22s</b> &nbsp; visible shift: card lift, reveal
  </div>
  <div class="motion" style="margin-top:14px">
    <button class="btn">Hover me — steel</button>
    <button class="btn warm">Hover me — bronze</button>
  </div>
</section>
<section>
  <h2>Radii — --r-1 … --r-4</h2>
  <div class="radii">
    <div class="box" style="border-radius:8px"><span>8</span></div>
    <div class="box" style="border-radius:10px"><span>10</span></div>
    <div class="box" style="border-radius:14px"><span>14</span></div>
    <div class="box" style="border-radius:18px"><span>18</span></div>
  </div>
</section>
<section>
  <h2>Elevation — --shadow-1 … --shadow-3</h2>
  <div class="shadows">
    <div class="card s1">shadow-1</div>
    <div class="card s2">shadow-2</div>
    <div class="card s3">shadow-3</div>
  </div>
</section>
