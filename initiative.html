<style>
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;}
.rune{font-family:var(--rune); line-height:1;}
#root{min-height:100vh;}

.wrap{max-width:820px; margin:0 auto; padding:18px 16px 60px;}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.wordmark{font-family:var(--disp); font-weight:700; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:9px;}
.wordmark .rune{color:var(--bronze); font-size:18px;}
.roundpill{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:5px 12px; background:var(--surf);}
.roundpill b{color:var(--ink);}

.i-btn{border:1px solid var(--line); border-radius:9px; padding:7px 13px; font-size:13px; cursor:pointer; background:var(--surf); color:var(--ink); font-family:inherit; transition:background .12s,border-color .12s;}
.i-btn:hover{background:var(--surf2); border-color:var(--steel-soft);}
.i-btn:disabled{opacity:.45; cursor:not-allowed;}
.i-btn.accent{border-color:var(--bronze-deep); color:var(--bronze);}
.i-btn.accent:hover{background:var(--warm); border-color:var(--bronze);}
.i-btn.danger{border-color:var(--line); color:var(--muted);}
.i-btn.danger:hover{border-color:#a5443a; color:#d8756a; background:rgba(165,68,58,.08);}
.i-input{background:var(--inset); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:7px 10px; outline:none; font-size:14px; font-family:inherit; width:100%;}
.i-input:focus{border-color:var(--bronze);}

.bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.bag{margin-left:auto; font-size:12px; color:var(--faint); display:flex; align-items:center; gap:6px;}
.bag b{color:var(--muted);}

.list{display:flex; flex-direction:column; gap:8px;}
.row{display:grid; grid-template-columns:34px 62px 1fr auto; align-items:center; gap:12px; background:var(--surf); border:1px solid var(--line); border-radius:12px; padding:11px 14px; transition:border-color .12s, background .12s;}
.row.now{border-color:var(--bronze-deep); background:var(--warm); box-shadow:0 0 0 1px var(--bronze-deep) inset;}
.row.undrawn{opacity:.72; border-style:dashed;}
.row.joker{border-color:#7b5cff55;}
.pos{font-family:var(--disp); font-weight:700; font-size:17px; color:var(--muted); text-align:center;}
.row.now .pos{color:var(--bronze);}
.glyphcell{display:flex; flex-direction:column; align-items:center; gap:1px;}
.glyph{font-family:var(--rune); font-size:26px; line-height:1; color:var(--ink);}
.row.joker .glyph{color:#9a83ff;}
.gval{font-size:10px; color:var(--faint); letter-spacing:.05em;}
.who{min-width:0;}
.who .nm{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.who .sub{font-size:11px; color:var(--faint); letter-spacing:.03em; margin-top:1px; display:flex; align-items:center; gap:6px;}
.tag{font-size:10px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--muted);}
.tag.j{color:#9a83ff; border-color:#7b5cff55;}
.tag.me{color:var(--steel); border-color:var(--steel-soft);}
.acts{display:flex; align-items:center; gap:6px;}
.mini{border:1px solid var(--line); background:var(--inset); color:var(--muted); border-radius:7px; width:28px; height:28px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
.mini:hover{border-color:var(--steel-soft); color:var(--ink);}
.mini:disabled{opacity:.3; cursor:not-allowed;}
.mini.x:hover{border-color:#a5443a; color:#d8756a;}

.empty{text-align:center; color:var(--faint); font-size:14px; padding:40px 10px; border:1px dashed var(--line); border-radius:12px;}
.hint{font-size:12px; color:var(--faint); margin:14px 2px 0; line-height:1.6;}

/* оверлеи */
.mask{position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center; justify-content:center; padding:18px; z-index:60;}
.card{background:var(--surf); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:420px;}
.card h3{font-family:var(--disp); margin:0 0 4px; font-size:20px; color:var(--ink);}
.card p.lead{color:var(--muted); font-size:13px; margin:0 0 16px;}
.field{margin-bottom:12px;} .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.03em;}
.err{color:#d8756a; font-size:13px; margin:6px 0 0;}
.row-actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}

/* вскрытие руны */
.reveal{text-align:center;}
.reveal .big{font-family:var(--rune); font-size:96px; line-height:1; color:var(--bronze); margin:6px 0 8px; animation:pop .32s ease;}
.reveal.j .big{color:#9a83ff;}
.reveal .rn{font-family:var(--disp); font-size:22px; color:var(--ink);}
.reveal .rmeta{font-size:13px; color:var(--muted); margin-top:4px;}
.reveal .rmeans{font-size:12.5px; color:var(--faint); margin-top:10px; line-height:1.5;}
@keyframes pop{0%{transform:scale(.4); opacity:0;} 70%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;}}

.charpick{display:flex; flex-direction:column; gap:6px; max-height:280px; overflow:auto; margin-top:4px;}
.charpick button{text-align:left; padding:10px 12px;}
.loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px;}
@media (max-width:520px){ .row{grid-template-columns:28px 52px 1fr auto; gap:9px; padding:10px 11px;} .glyph{font-size:22px;} }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ── тот же конфиг Firebase, что и в остальных кабинетах ── */
const firebaseConfig = {
  apiKey: "AIzaSyCSb7M5IbOql61HIqOUxe3ct4VqdjkhLyE",
  authDomain: "ragnarau-80866.firebaseapp.com",
  projectId: "ragnarau-80866",
  storageBucket: "ragnarau-80866.firebasestorage.app",
  messagingSenderId: "727752765165",
  appId: "1:727752765165:web:8c625b7675f022a1b026e4"
};
const HAS_FB = !!(window.firebase && firebaseConfig.apiKey);
let db = null, auth = null;
if (HAS_FB) { try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); db = firebase.firestore(); auth = firebase.auth(); } catch (e) { console.error(e); } }

/* ── Старший Футарк: инициатива = порядковый номер руны (1 — первым, 24 — последним) ── */
const RUNES = [
  { id:"fehu",     glyph:"ᚠ", name:"Феху" },
  { id:"uruz",     glyph:"ᚢ", name:"Уруз" },
  { id:"thurisaz", glyph:"ᚦ", name:"Турисаз" },
  { id:"ansuz",    glyph:"ᚨ", name:"Ансуз" },
  { id:"raido",    glyph:"ᚱ", name:"Райдо" },
  { id:"kenaz",    glyph:"ᚲ", name:"Кеназ" },
  { id:"gebo",     glyph:"ᚷ", name:"Гебо" },
  { id:"wunjo",    glyph:"ᚹ", name:"Вуньо" },
  { id:"hagalaz",  glyph:"ᚺ", name:"Хагалаз" },
  { id:"nautiz",   glyph:"ᚾ", name:"Наутиз" },
  { id:"isa",      glyph:"ᛁ", name:"Иса" },
  { id:"jera",     glyph:"ᛃ", name:"Йера" },
  { id:"eihwaz",   glyph:"ᛇ", name:"Эйваз" },
  { id:"perthro",  glyph:"ᛈ", name:"Перто" },   // Джокер
  { id:"algiz",    glyph:"ᛉ", name:"Альгиз" },
  { id:"sowilo",   glyph:"ᛊ", name:"Соулу" },
  { id:"tiwaz",    glyph:"ᛏ", name:"Тейваз" },
  { id:"berkano",  glyph:"ᛒ", name:"Беркана" },
  { id:"ehwaz",    glyph:"ᛖ", name:"Эваз" },
  { id:"mannaz",   glyph:"ᛗ", name:"Манназ" },
  { id:"laguz",    glyph:"ᛚ", name:"Лагуз" },
  { id:"ingwaz",   glyph:"ᛜ", name:"Ингваз" },
  { id:"dagaz",    glyph:"ᛞ", name:"Дагаз" },
  { id:"othala",   glyph:"ᛟ", name:"Отала" },
];
const JOKER = "perthro";
const RMAP = {}; RUNES.forEach((r, i) => { RMAP[r.id] = { ...r, value: i + 1 }; });
const valueOf = (id) => RMAP[id] ? RMAP[id].value : 999;
const isJokerId = (id) => id === JOKER;

/* краткие трактовки для окна вскрытия */
const MEANS = {
  perthro: "Чаша жребия. Джокер — встань в любое место очереди.",
};

/* ── пароль ведущей (та же схема, что в панели) ── */
async function gmHash(campaign, pw) {
  const data = new TextEncoder().encode("ragnarok:" + campaign + ":" + pw);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
const gmPwRef = (c) => db.collection("campaigns").doc(c).collection("config").doc("gm");
const gmDeviceKey = (c) => "ragnarok-gmpw-" + c;

const qp = new URLSearchParams(location.search);
function initialCampaign() {
  const fromUrl = (qp.get("c") || "").trim();
  if (fromUrl) return fromUrl.toLowerCase();
  try {
    const cur = JSON.parse(localStorage.getItem("ragnarok-current") || "null");
    if (cur && cur.campaign) return cur.campaign;
  } catch (e) {}
  try { return (localStorage.getItem("ragnarok-board-campaign") || localStorage.getItem("ragnarok-campaign") || "").toLowerCase(); } catch (e) { return ""; }
}
function initialCharId(camp) {
  try { const cur = JSON.parse(localStorage.getItem("ragnarok-current") || "null"); if (cur && cur.campaign === camp && cur.charId) return cur.charId; } catch (e) {}
  return null;
}

const initRef = (c) => db.collection("campaigns").doc(c).collection("boards").doc("initiative");

/* ─────────────────────────── приложение ─────────────────────────── */
function App() {
  const role = qp.get("role") === "gm" ? "gm" : "player";
  const [campaign, setCampaign] = useState(initialCampaign());
  const [joined, setJoined] = useState(false);
  const [isGM, setIsGM] = useState(false);
  const [myCharId, setMyCharId] = useState(null);
  const [chars, setChars] = useState([]);
  const [board, setBoard] = useState({ round: 1, gmRows: [], draws: {} });
  const [err, setErr] = useState("");
  const [reveal, setReveal] = useState(null);   // {glyph,name,value,joker}
  const [busy, setBusy] = useState(false);

  /* живой список героев */
  useEffect(() => {
    if (!joined || !db || !campaign) return;
    const unsub = db.collection("campaigns").doc(campaign).collection("characters").onSnapshot(
      (qs) => { const a = []; qs.forEach((d) => a.push({ id: d.id, name: (d.data().name || "").trim() || "без имени" })); a.sort((x, y) => x.name.localeCompare(y.name)); setChars(a); },
      (e) => setErr("Чтение героев: " + e.message)
    );
    return () => unsub();
  }, [joined, campaign]);

  /* живая доска инициативы */
  useEffect(() => {
    if (!joined || !db || !campaign) return;
    const unsub = initRef(campaign).onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : {};
      setBoard({ round: d.round || 1, gmRows: Array.isArray(d.gmRows) ? d.gmRows : [], draws: d.draws || {} });
    }, (e) => setErr("Чтение доски: " + e.message));
    return () => unsub();
  }, [joined, campaign]);

  /* ── строки очереди ── */
  const entries = useMemo(() => {
    const out = [];
    chars.forEach((c) => out.push({ key: "c:" + c.id, kind: "char", name: c.name, refId: c.id }));
    board.gmRows.forEach((r) => out.push({ key: "g:" + r.id, kind: "gm", name: r.name || "враг", refId: r.id }));
    out.forEach((e) => { e.draw = board.draws[e.key] || null; });
    return out;
  }, [chars, board]);

  /* порядок: по возрастанию значения (низшая — первой); Джокер стоит там, где его поставили */
  const ordered = useMemo(() => {
    const drawn = entries.filter((e) => e.draw);
    const undrawn = entries.filter((e) => !e.draw).sort((a, b) => a.name.localeCompare(b.name));
    const joker = drawn.find((e) => isJokerId(e.draw.runeId));
    let rest = drawn.filter((e) => e !== joker).sort((a, b) => valueOf(a.draw.runeId) - valueOf(b.draw.runeId));
    if (joker) {
      const nat = rest.filter((e) => valueOf(e.draw.runeId) < valueOf(JOKER)).length;
      let at = Number.isInteger(joker.draw.jokerAt) ? joker.draw.jokerAt : nat;
      at = Math.max(0, Math.min(rest.length, at));
      rest = [...rest.slice(0, at), joker, ...rest.slice(at)];
    }
    return [...rest, ...undrawn];
  }, [entries]);

  const takenIds = useMemo(() => new Set(Object.values(board.draws).map((d) => d.runeId)), [board]);
  const bagLeft = RUNES.length - takenIds.size;

  const canDraw = (e) => isGM || (e.kind === "char" && e.refId === myCharId);
  const canMoveJoker = (e) => e.draw && isJokerId(e.draw.runeId) && canDraw(e);

  /* ── тянуть руну (транзакция: без дублей даже при гонке) ── */
  async function draw(e) {
    if (busy || !canDraw(e)) return;
    setBusy(true); setErr("");
    try {
      let picked = null;
      await db.runTransaction(async (tx) => {
        const ref = initRef(campaign);
        const snap = await tx.get(ref);
        const d = snap.exists ? snap.data() : {};
        const draws = d.draws || {};
        if (draws[e.key]) { picked = draws[e.key].runeId; return; }        // уже тянул в этом раунде
        const taken = new Set(Object.values(draws).map((x) => x.runeId));
        const pool = RUNES.filter((r) => !taken.has(r.id));
        if (!pool.length) throw new Error("Мешок пуст — руны кончились.");
        const r = pool[Math.floor(Math.random() * pool.length)];
        picked = r.id;
        const entry = { runeId: r.id };
        if (isJokerId(r.id)) {
          const nat = Object.values(draws).filter((x) => valueOf(x.runeId) < valueOf(JOKER)).length;
          entry.jokerAt = nat;
        }
        tx.set(ref, { round: d.round || 1, gmRows: d.gmRows || [], draws: { ...draws, [e.key]: entry }, updatedAt: Date.now() }, { merge: true });
      });
      if (picked) { const r = RMAP[picked]; setReveal({ glyph: r.glyph, name: r.name, value: r.value, joker: isJokerId(picked), who: e.name }); }
    } catch (ex) { setErr(ex.message); }
    setBusy(false);
  }

  async function moveJoker(e, dir) {
    if (!canMoveJoker(e)) return;
    const idx = ordered.indexOf(e);
    const target = Math.max(0, Math.min(ordered.filter((x) => x.draw).length - 1, idx + dir));
    if (target === idx) return;
    // индекс показа джокера = его позиция среди прочих вытянувших → это и есть jokerAt
    const restLen = ordered.filter((x) => x.draw && !isJokerId(x.draw.runeId)).length;
    const newAt = Math.max(0, Math.min(restLen, target));
    await patchDraw(e.key, { jokerAt: newAt });
  }

  async function patchDraw(key, obj) {
    try {
      const ref = initRef(campaign);
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(ref);
        const d = snap.exists ? snap.data() : {};
        const draws = d.draws || {};
        if (!draws[key]) return;
        tx.set(ref, { draws: { ...draws, [key]: { ...draws[key], ...obj } }, updatedAt: Date.now() }, { merge: true });
      });
    } catch (ex) { setErr(ex.message); }
  }

  /* ── новый раунд: всё в мешок, все тянут заново ── */
  async function newRound() {
    if (!isGM) return;
    if (!confirm("Новый раунд? Все руны вернутся в мешок, очередь очистится — каждый тянет заново.")) return;
    try { await initRef(campaign).set({ round: (board.round || 1) + 1, draws: {}, updatedAt: Date.now() }, { merge: true }); }
    catch (ex) { setErr(ex.message); }
  }

  /* ── полный сброс: новый бой с 1-го раунда, без инициативы; строки ведущей остаются ── */
  async function fullRestart() {
    if (!isGM) return;
    if (!confirm("Начать новый бой? Раунд станет 1-м, вся инициатива очистится. Строки ведущей останутся.")) return;
    try { await initRef(campaign).set({ round: 1, draws: {}, updatedAt: Date.now() }, { merge: true }); }
    catch (ex) { setErr(ex.message); }
  }

  /* ── ведущая: строки, удаление, раздача ── */
  async function addGmRow(name) {
    const nm = (name || "").trim(); if (!nm) return;
    const id = "r" + Math.random().toString(36).slice(2, 9);
    try { await initRef(campaign).set({ gmRows: [...board.gmRows, { id, name: nm }], updatedAt: Date.now() }, { merge: true }); }
    catch (ex) { setErr(ex.message); }
  }
  async function delGmRow(refId) {
    const key = "g:" + refId;
    const draws = { ...board.draws }; delete draws[key];
    try { await initRef(campaign).set({ gmRows: board.gmRows.filter((r) => r.id !== refId), draws, updatedAt: Date.now() }, { merge: true }); }
    catch (ex) { setErr(ex.message); }
  }
  async function clearGmRows() {
    if (!board.gmRows.length) return;
    if (!confirm("Удалить все строки ведущей? Герои останутся.")) return;
    const draws = {}; Object.keys(board.draws).forEach((k) => { if (k.startsWith("c:")) draws[k] = board.draws[k]; });
    try { await initRef(campaign).set({ gmRows: [], draws, updatedAt: Date.now() }, { merge: true }); }
    catch (ex) { setErr(ex.message); }
  }
  async function drawAllGm() {
    for (const r of board.gmRows) {
      const e = { key: "g:" + r.id, kind: "gm", name: r.name, refId: r.id, draw: board.draws["g:" + r.id] || null };
      if (!e.draw) { await draw(e); }
    }
  }

  if (!joined) return <Gate role={role} campaign={campaign} setCampaign={setCampaign}
    onPlayer={(c, cid) => { setCampaign(c); setMyCharId(cid); setIsGM(false); setJoined(true); }}
    onGM={(c) => { setCampaign(c); setIsGM(true); setJoined(true); }} />;

  const drawnCount = entries.filter((e) => e.draw).length;
  const iNeedToRoll = !isGM && myCharId && !board.draws["c:" + myCharId] && chars.some((c) => c.id === myCharId);

  return (
    <div className="wrap">
      <div className="top">
        <div className="wordmark"><span className="rune">ᛁ</span> Инициатива · {campaign}</div>
        <div className="roundpill">раунд <b>{board.round}</b></div>
      </div>

      <div className="bar">
        {isGM && <button className="i-btn accent" onClick={newRound}>↻ Новый раунд</button>}
        {isGM && <GmAdd onAdd={addGmRow} />}
        {isGM && board.gmRows.length > 0 && <button className="i-btn" onClick={drawAllGm} disabled={busy}>🎲 Тянуть за всех моих</button>}
        {isGM && board.gmRows.length > 0 && <button className="i-btn danger" onClick={clearGmRows}>Убрать все мои строки</button>}
        <span className="bag">в мешке <b>{bagLeft}</b> из 24</span>
      </div>

      {iNeedToRoll && <div className="bar"><button className="i-btn accent" disabled={busy} onClick={() => draw({ key: "c:" + myCharId, kind: "char", name: (chars.find((c) => c.id === myCharId) || {}).name, refId: myCharId, draw: null })}>🎲 Тянуть свою руну</button></div>}

      {err && <p className="err">{err}</p>}

      {ordered.length === 0
        ? <div className="empty">Нет героев в кампании. Добавь строку (ведущая) или зайди героем.</div>
        : <div className="list">
            {ordered.map((e, i) => {
              const isNow = e.draw && i === 0;
              const joker = e.draw && isJokerId(e.draw.runeId);
              const mine = e.kind === "char" && e.refId === myCharId;
              return (
                <div key={e.key} className={"row" + (isNow ? " now" : "") + (!e.draw ? " undrawn" : "") + (joker ? " joker" : "")}>
                  <div className="pos">{e.draw ? i + 1 : "—"}</div>
                  <div className="glyphcell">
                    {e.draw
                      ? <React.Fragment><span className="glyph">{RMAP[e.draw.runeId].glyph}</span><span className="gval">№{RMAP[e.draw.runeId].value}</span></React.Fragment>
                      : <span className="glyph" style={{ opacity: .25 }}>·</span>}
                  </div>
                  <div className="who">
                    <div className="nm">{e.name}</div>
                    <div className="sub">
                      {e.kind === "gm" ? <span className="tag">ведущая</span> : null}
                      {mine ? <span className="tag me">это я</span> : null}
                      {joker ? <span className="tag j">джокер</span> : null}
                      {e.draw ? <span>{RMAP[e.draw.runeId].name}</span> : <span>не тянул</span>}
                      {isNow ? <span style={{ color: "var(--bronze)" }}>· ходит сейчас</span> : null}
                    </div>
                  </div>
                  <div className="acts">
                    {canMoveJoker(e) && <React.Fragment>
                      <button className="mini" title="выше" onClick={() => moveJoker(e, -1)}>▲</button>
                      <button className="mini" title="ниже" onClick={() => moveJoker(e, +1)}>▼</button>
                    </React.Fragment>}
                    {!e.draw && canDraw(e) && <button className="i-btn" disabled={busy} onClick={() => draw(e)}>🎲 тянуть</button>}
                    {isGM && e.kind === "gm" && <button className="mini x" title="удалить строку" onClick={() => delGmRow(e.refId)}>✕</button>}
                  </div>
                </div>
              );
            })}
          </div>}

      <p className="hint">
        Инициатива — руна Старшего Футарка (№1 ходит первым, №24 последним). Каждая руна в мешке одна — двойников нет.<br />
        <b>Перто (ᛈ)</b> — Джокер: его хозяин встаёт в любое место очереди стрелками ▲▼.
        {isGM ? " Новый раунд возвращает все руны в мешок; каждый тянет заново." : " Каждый тянет свою руну сам."}
      </p>

      {isGM && <div style={{ marginTop: 26, paddingTop: 18, borderTop: "1px solid var(--line)", display: "flex", justifyContent: "center" }}>
        <button className="i-btn danger" onClick={fullRestart}>⚔ Новый бой (с 1-го раунда)</button>
      </div>}

      {reveal && <RevealCard r={reveal} onClose={() => setReveal(null)} />}
    </div>
  );
}

/* ── добавить строку ведущей ── */
function GmAdd({ onAdd }) {
  const [v, setV] = useState("");
  return (
    <span style={{ display: "inline-flex", gap: 6 }}>
      <input className="i-input" style={{ width: 150 }} value={v} placeholder="+ имя врага/NPC" onChange={(e) => setV(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { onAdd(v); setV(""); } }} />
      <button className="i-btn" onClick={() => { onAdd(v); setV(""); }}>Добавить</button>
    </span>
  );
}

/* ── окно вскрытия руны ── */
function RevealCard({ r, onClose }) {
  return (
    <div className="mask" onClick={onClose}>
      <div className={"card reveal" + (r.joker ? " j" : "")} onClick={(e) => e.stopPropagation()}>
        {r.who && <p className="lead" style={{ margin: "0 0 2px" }}>{r.who} тянет…</p>}
        <div className="big">{r.glyph}</div>
        <div className="rn">{r.name}</div>
        <div className="rmeta">инициатива №{r.value}{r.joker ? " · Джокер" : ""}</div>
        {r.joker && <div className="rmeans">{MEANS.perthro}</div>}
        <div className="row-actions" style={{ justifyContent: "center" }}><button className="i-btn accent" onClick={onClose}>Ясно</button></div>
      </div>
    </div>
  );
}

/* ─────────────────────────── вход ─────────────────────────── */
function Gate({ role, campaign, setCampaign, onPlayer, onGM }) {
  const [code, setCode] = useState(campaign || "");
  const [step, setStep] = useState("code");     // code | gmset | gmenter | pickchar
  const [pw, setPw] = useState(""); const [pw2, setPw2] = useState("");
  const [hash, setHash] = useState("");
  const [chars, setChars] = useState([]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const norm = (s) => s.trim().toLowerCase().replace(/[^a-zа-я0-9_-]/gi, "");

  async function goCode() {
    if (!HAS_FB || !db) { setErr("Нет конфига Firebase."); return; }
    const c = norm(code); if (!c) { setErr("Введи код кампании."); return; }
    setBusy(true); setErr("");
    try { await auth.signInAnonymously(); } catch (e) { setBusy(false); setErr("Включи Anonymous в Firebase."); return; }
    if (role === "gm") {
      let h = ""; try { const s = await gmPwRef(c).get(); h = (s.exists && s.data().pwHash) || ""; } catch (e) { setBusy(false); setErr("Нет связи: " + e.message); return; }
      if (!h) { setCode(c); setStep("gmset"); setBusy(false); return; }
      let remembered = ""; try { remembered = localStorage.getItem(gmDeviceKey(c)) || ""; } catch (e) {}
      if (remembered && remembered === h) { setBusy(false); onGM(c); return; }
      setCode(c); setHash(h); setStep("gmenter"); setBusy(false); return;
    }
    // игрок: если он уже вошёл героем в эту кампанию — сразу внутрь
    const known = initialCharId(c);
    if (known) { setBusy(false); onPlayer(c, known); return; }
    try {
      const qs = await db.collection("campaigns").doc(c).collection("characters").get();
      const a = []; qs.forEach((d) => a.push({ id: d.id, name: (d.data().name || "").trim() || "без имени" }));
      a.sort((x, y) => x.name.localeCompare(y.name));
      setCode(c); setChars(a); setStep("pickchar"); setBusy(false);
    } catch (e) { setBusy(false); setErr("Нет связи: " + e.message); }
  }

  async function gmSet() {
    if (!pw || pw.length < 3) { setErr("Пароль от 3 символов."); return; }
    if (pw !== pw2) { setErr("Пароли не совпадают."); return; }
    const h = await gmHash(code, pw);
    try { await gmPwRef(code).set({ pwHash: h, updatedAt: Date.now() }, { merge: true }); } catch (e) { setErr("Не сохранить: " + e.message); return; }
    try { localStorage.setItem(gmDeviceKey(code), h); } catch (e) {}
    onGM(code);
  }
  async function gmEnter() {
    if (!pw) { setErr("Введи пароль."); return; }
    const h = await gmHash(code, pw);
    if (h !== hash) { setErr("Неверный пароль."); return; }
    try { localStorage.setItem(gmDeviceKey(code), h); } catch (e) {}
    onGM(code);
  }
  function pick(cid) {
    try { localStorage.setItem("ragnarok-current", JSON.stringify({ campaign: code, charId: cid })); } catch (e) {}
    onPlayer(code, cid);
  }

  return (
    <div className="wrap" style={{ maxWidth: 440, marginTop: 40 }}>
      <div className="card">
        <h3>{role === "gm" ? "Инициатива · ведущая" : "Инициатива"}</h3>
        {step === "code" && <React.Fragment>
          <p className="lead">{role === "gm" ? "Код кампании и пароль ведущей." : "Код кампании — увидишь общую очередь и бросишь за своего героя."}</p>
          <div className="field"><label>Код кампании</label><input className="i-input" value={code} autoFocus onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === "Enter" && goCode()} placeholder="например, ragnarok" /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" disabled={busy} onClick={goCode}>Войти</button></div>
        </React.Fragment>}

        {step === "gmset" && <React.Fragment>
          <p className="lead">Пароль ведущей ещё не задан для «{code}». Придумай его — он общий для всей панели.</p>
          <div className="field"><label>Новый пароль</label><input className="i-input" type="password" value={pw} autoFocus onChange={(e) => setPw(e.target.value)} /></div>
          <div className="field"><label>Ещё раз</label><input className="i-input" type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && gmSet()} /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" onClick={gmSet}>Задать и войти</button><button className="i-btn" onClick={() => { setStep("code"); setErr(""); }}>Назад</button></div>
        </React.Fragment>}

        {step === "gmenter" && <React.Fragment>
          <p className="lead">Пароль ведущей для «{code}».</p>
          <div className="field"><label>Пароль</label><input className="i-input" type="password" value={pw} autoFocus onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && gmEnter()} /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" onClick={gmEnter}>Войти</button><button className="i-btn" onClick={() => { setStep("code"); setErr(""); }}>Назад</button></div>
        </React.Fragment>}

        {step === "pickchar" && <React.Fragment>
          <p className="lead">Кто ты в «{code}»? Выбери своего героя — за него и будешь бросать.</p>
          {chars.length === 0
            ? <p className="err">В кампании нет героев. Сначала создай карту героя.</p>
            : <div className="charpick">{chars.map((c) => <button key={c.id} className="i-btn" onClick={() => pick(c.id)}>{c.name}</button>)}</div>}
          <div className="row-actions"><button className="i-btn" onClick={() => { setStep("code"); setErr(""); }}>Назад</button></div>
        </React.Fragment>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="app-shell.js" defer></script>
</body>
</html>
