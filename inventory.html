<style>
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;}
.rune{font-family:var(--rune); line-height:1;}
#root{min-height:100vh;}
.loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px;}

.wrap{max-width:1040px; margin:0 auto; padding:18px 16px 72px;}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.wordmark{font-family:var(--disp); font-weight:700; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:9px;}
.wordmark .rune{color:var(--bronze); font-size:18px;}
.topacts{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

.i-btn{border:1px solid var(--line); border-radius:9px; padding:7px 13px; font-size:13px; cursor:pointer; background:var(--surf); color:var(--ink); font-family:inherit; transition:border-color var(--dur-1,.14s) var(--ease,ease), color var(--dur-1,.14s) var(--ease,ease), background var(--dur-1,.14s) var(--ease,ease), transform var(--dur-1,.14s) var(--ease,ease);}
.i-btn:hover{background:var(--surf2); border-color:var(--steel-soft);}
.i-btn:active:not(:disabled){transform:translateY(1px);}
.i-btn:disabled{opacity:.45; cursor:not-allowed;}
.i-btn.accent{border-color:var(--bronze-deep); color:var(--bronze);}
.i-btn.accent:hover{background:var(--warm); border-color:var(--bronze);}
.i-btn.danger{border-color:var(--line); color:var(--muted);}
.i-btn.danger:hover{border-color:var(--red); color:var(--red); background:rgba(191,97,106,.08);}
.i-btn.sm{padding:5px 10px; font-size:12px;}
.i-input, .i-area, .i-sel{background:var(--inset); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:7px 10px; outline:none; font-size:14px; font-family:inherit; width:100%;}
.i-area{min-height:84px; resize:vertical; line-height:1.5;}
.i-input:focus, .i-area:focus, .i-sel:focus{border-color:var(--bronze);}

/* ── панель фильтров ── */
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; background:var(--surf); border:1px solid var(--line); border-radius:13px; padding:12px 14px; margin-bottom:18px;}
.fgrp{display:flex; flex-direction:column; gap:5px; min-width:120px;}
.fgrp label{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--faint);}
.fgrp .i-sel{min-width:120px;}
.tagfilter{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.tagpick{font-size:11px; letter-spacing:.03em; border:1px solid var(--line); border-radius:6px; padding:3px 9px; color:var(--muted); cursor:pointer; background:var(--inset); user-select:none;}
.tagpick.on{color:var(--bronze); border-color:var(--bronze-deep); background:var(--warm);}
.filtersp{flex:1;}
.fcount{font-size:12px; color:var(--faint); white-space:nowrap;}

/* ── сетка карточек ── */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(214px,1fr)); gap:12px;}
.gcard{background:var(--surf); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; transition:border-color var(--dur-1,.14s) var(--ease,ease), transform var(--dur-1,.14s) var(--ease,ease), box-shadow var(--dur-2,.22s) var(--ease,ease);}
.gcard:hover{border-color:var(--steel-soft); transform:translateY(-2px); box-shadow:var(--shadow-2);}
.gcard.hidden{border-style:dashed; border-color:var(--line-warm);}
.gthumb{aspect-ratio:4/3; background:var(--inset); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.gthumb img{width:100%; height:100%; object-fit:cover; display:block;}
.gthumb .noimg{font-family:var(--rune); font-size:34px; color:var(--faint); opacity:.6;}
.gbody{padding:11px 13px 13px; display:flex; flex-direction:column; gap:7px; flex:1;}
.gtitle{font-family:var(--disp); font-weight:700; font-size:15.5px; line-height:1.25; color:var(--ink);}
.gmeta{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:11px; color:var(--faint);}
.ttype{border:1px solid var(--line); border-radius:5px; padding:1px 7px; letter-spacing:.03em; color:var(--muted); background:var(--inset);}
.ttype.item{color:var(--steel); border-color:var(--steel-deep);}
.ttype.person{color:var(--ember); border-color:var(--bronze-deep);}
.ttype.note{color:var(--bronze); border-color:var(--bronze-deep);}
.gsess{color:var(--faint);}
.gtags{display:flex; flex-wrap:wrap; gap:4px; margin-top:auto;}
.chip{font-size:10.5px; letter-spacing:.03em; border:1px solid var(--line); border-radius:6px; padding:1px 7px; color:var(--muted); background:var(--inset);}
.badge{position:absolute; top:8px; left:8px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; border-radius:6px; padding:3px 7px; font-weight:700; backdrop-filter:blur(3px);}
.badge.hid{background:rgba(161,126,62,.85); color:#1a1207; border:1px solid var(--bronze-deep);}
.gcard.hidden .gthumb{opacity:.78;}

/* ── карточка-модалка ── */
.mask{position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; z-index:60; overflow:auto; animation:sFade var(--dur-2,.22s) var(--ease,ease);}
.card{background:var(--surf); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:600px; box-shadow:var(--shadow-3,0 24px 60px -20px rgba(0,0,0,.7)); animation:sRise .28s var(--ease,ease); margin:auto 0;}
.card.wide{max-width:680px;}
.card.narrow{max-width:430px;}
.card h3{font-family:var(--disp); margin:0 0 4px; font-size:22px; color:var(--ink);}
.card p.lead{color:var(--muted); font-size:13px; margin:0 0 16px;}
.field{margin-bottom:12px;}
.field label, .fcol label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.03em;}
.field label .gmtag{color:var(--bronze); font-weight:700; letter-spacing:.06em;}
.row-actions{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; align-items:center;}
.row-actions .sp{flex:1;}
@keyframes sFade{from{opacity:0;} to{opacity:1;}}
@keyframes sRise{from{opacity:0; transform:translateY(12px) scale(.985);} to{opacity:1; transform:none;}}

/* ── просмотр артефакта ── */
.vhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px;}
.vtitle{font-family:var(--disp); font-weight:700; font-size:23px; line-height:1.2; margin:0;}
.vmeta{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:6px 0 0; font-size:12px; color:var(--faint);}
.vimg{width:100%; border-radius:12px; border:1px solid var(--line); margin:0 0 14px; display:block; background:var(--inset);}
.vsec{margin-bottom:14px;}
.vsec h4{font-family:var(--disp); font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:700;}
.vsec h4.gm{color:var(--bronze);}
.vtext{font-size:14px; line-height:1.65; color:var(--ink); white-space:pre-wrap;}
.gmbox{border:1px solid var(--line-warm); background:var(--warm); border-radius:11px; padding:12px 14px;}
.vtags{display:flex; flex-wrap:wrap; gap:6px;}
.vlinks{display:flex; flex-wrap:wrap; gap:7px;}
.linkchip{font-size:12px; border:1px solid var(--steel-deep); color:var(--steel); border-radius:7px; padding:4px 10px; cursor:pointer; background:var(--inset); display:inline-flex; align-items:center; gap:6px; transition:background var(--dur-1,.14s) var(--ease,ease);}
.linkchip:hover{background:var(--surf2);}
.linkchip.dead{border-color:var(--line); color:var(--faint); cursor:default;}

/* ── форма ── */
.frow{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
.fcol{flex:1; min-width:130px;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.seg button{border:none; background:var(--inset); color:var(--muted); padding:7px 13px; font-size:13px; cursor:pointer; font-family:inherit; border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--surf2); color:var(--ink);}
.imgprev{width:100%; max-height:190px; object-fit:contain; border-radius:10px; border:1px solid var(--line); margin-top:8px; background:var(--inset); display:block;}
.imgbad{font-size:12px; color:var(--red); margin-top:6px;}
.tagedit{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.tagx{font-size:11.5px; border:1px solid var(--bronze-deep); color:var(--bronze); border-radius:6px; padding:2px 6px 2px 9px; background:var(--warm); display:inline-flex; align-items:center; gap:5px;}
.tagx b{cursor:pointer; color:var(--muted); font-weight:700;}
.tagx b:hover{color:var(--red);}
.linkedit{display:flex; flex-direction:column; gap:6px; max-height:160px; overflow:auto; border:1px solid var(--line); border-radius:9px; padding:8px; background:var(--inset);}
.linkrow{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; user-select:none;}
.linkrow input{margin:0;}
.revealtoggle{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; border:1px solid var(--line); border-radius:9px; padding:7px 12px; background:var(--inset);}
.revealtoggle.on{color:var(--steel); border-color:var(--steel-deep); background:var(--surf2);}

.empty{text-align:center; color:var(--faint); font-size:14px; padding:44px 14px; border:1px dashed var(--line); border-radius:14px;}
.hint{font-size:12px; color:var(--faint); margin:18px 2px 0; line-height:1.6;}
.err{color:var(--red); font-size:13px; margin:8px 0 0;}

@media (max-width:560px){
  .filters{gap:8px;}
  .fgrp{min-width:0; flex:1;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .vtitle{font-size:20px;}
}
</style>

<script>/* роль шапки берём из адреса: ?role=gm → навигация ведущей */try{if(new URLSearchParams(location.search).get('role')==='gm'){document.querySelector('header[data-shell]').setAttribute('data-role','gm');}}catch(e){}</script>
<div id="root"><div class="loading">Загрузка…</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ── тот же конфиг Firebase, что и в остальных кабинетах ── */
const firebaseConfig = {
  apiKey: "AIzaSyCSb7M5IbOql61HIqOUxe3ct4VqdjkhLyE",
  authDomain: "ragnarau-80866.firebaseapp.com",
  projectId: "ragnarau-80866",
  storageBucket: "ragnarau-80866.firebasestorage.app",
  messagingSenderId: "727752765165",
  appId: "1:727752765165:web:8c625b7675f022a1b026e4"
};
const HAS_FB = !!(window.firebase && firebaseConfig.apiKey);
let db = null, auth = null;
if (HAS_FB) { try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); db = firebase.firestore(); auth = firebase.auth(); } catch (e) { console.error(e); } }

/* ── пароль ведущей: та же схема, что в панели, инициативе и спотлайте ── */
async function gmHash(campaign, pw) {
  const data = new TextEncoder().encode("ragnarok:" + campaign + ":" + pw);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
const gmPwRef = (c) => db.collection("campaigns").doc(c).collection("config").doc("gm");
const gmDeviceKey = (c) => "ragnarok-gmpw-" + c;

/* ── дозапись, ключ-на-сущность ──
   Приватность держится на физическом разделении хранилищ (ТЗ §5, §8):
   • pubCol  — открытые артефакты, только публичная часть (inv:pub:{id}).
               Читают все игроки. `hidden` сюда НЕ попадает никогда.
   • gmCol   — мастер-запись ведущей со всеми полями, включая скрытые
               и полностью скрытые артефакты (inv:gm:{id}). Читает только ГМ. */
const pubCol = (c) => db.collection("campaigns").doc(c).collection("inventory");
const gmCol  = (c) => db.collection("campaigns").doc(c).collection("inventoryGm");
const pubRef = (c, id) => pubCol(c).doc(id);
const gmRef  = (c, id) => gmCol(c).doc(id);

const qp = new URLSearchParams(location.search);
function initialCampaign() {
  const fromUrl = (qp.get("c") || "").trim();
  if (fromUrl) return fromUrl.toLowerCase();
  try { const cur = JSON.parse(localStorage.getItem("ragnarok-current") || "null"); if (cur && cur.campaign) return cur.campaign; } catch (e) {}
  try { return (localStorage.getItem("ragnarok-board-campaign") || localStorage.getItem("ragnarok-campaign") || "").toLowerCase(); } catch (e) { return ""; }
}

/* ── типы и их ярлыки: единая модель, разные подписи полей (ТЗ §4) ── */
const TYPES = ["item", "person", "note"];
const TYPE_LABEL = { item: "предмет", person: "человек", note: "записка" };
const TYPE_FIELDS = {
  item:   { title: "Название", titlePh: "Секира Тюра",          public: "Что видно партии", publicPh: "Описание предмета, что о нём известно…", hidden: "Скрытый лор  [ГМ]", hiddenPh: "Проклятие, истинная природа, подтекст…" },
  person: { title: "Имя и алиасы", titlePh: "Хёльд · «Серый купец»", public: "Что известно партии", publicPh: "Как выглядит, чем известен, что заявляет…", hidden: "Досье  [ГМ]", hiddenPh: "Истинные мотивы, связи, тайны…" },
  note:   { title: "От кого → кому", titlePh: "Улла → всей партии", public: "Текст записки", publicPh: "Содержимое письма/записки, как его читает партия…", hidden: "Подтекст  [ГМ]", hiddenPh: "Что между строк, что скрыто от читающих…" },
};
const TYPE_RUNE = { item: "ᛘ", person: "ᚿ", note: "ᛦ" };

const newId = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const blankArtifact = (session) => ({
  id: newId(), type: "item", session: session || 1, title: "", image: "",
  public: "", hidden: "", reveal: "hidden", tags: [], links: [],
});

/* публичная (безопасная) проекция мастер-записи — БЕЗ `hidden` */
function publicProjection(a) {
  return {
    id: a.id, type: a.type, session: a.session || 0, title: a.title || "",
    image: a.image || "", public: a.public || "", reveal: "open",
    tags: Array.isArray(a.tags) ? a.tags : [], links: Array.isArray(a.links) ? a.links : [],
    updatedAt: Date.now(),
  };
}

/* ─────────────────────────── приложение ─────────────────────────── */
function App() {
  const role = qp.get("role") === "gm" ? "gm" : "player";
  const [campaign, setCampaign] = useState(initialCampaign());
  const [joined, setJoined] = useState(false);
  const [isGM, setIsGM] = useState(false);
  const [items, setItems] = useState(null);       // null = ещё грузим
  const [err, setErr] = useState("");
  const [view, setView] = useState(null);         // артефакт в просмотре (по id)
  const [editing, setEditing] = useState(null);   // артефакт в правке (объект) или "new"
  const [fType, setFType] = useState("all");
  const [fSession, setFSession] = useState("all");
  const [fTags, setFTags] = useState([]);

  /* живой инвентарь: ГМ читает мастер-коллекцию, игрок — публичную */
  useEffect(() => {
    if (!joined || !db || !campaign) return;
    const col = isGM ? gmCol(campaign) : pubCol(campaign);
    const unsub = col.onSnapshot(
      (qs) => { const a = []; qs.forEach((d) => { const r = d.data(); if (r && r.id) a.push(r); }); setItems(a); },
      (e) => { setErr("Чтение инвентаря: " + e.message); setItems([]); }
    );
    return () => unsub();
  }, [joined, isGM, campaign]);

  if (!joined) return <Gate role={role} campaign={campaign} setCampaign={setCampaign}
    onPlayer={(c) => { setCampaign(c); setIsGM(false); setJoined(true); }}
    onGM={(c) => { setCampaign(c); setIsGM(true); setJoined(true); }} />;

  if (items === null) return <div className="loading">Открываем инвентарь…</div>;

  /* ── запись: try/catch, дозапись без затирания соседей ── */
  async function saveArtifact(a) {
    try {
      const rec = {
        id: a.id, type: a.type, session: parseInt(a.session, 10) || 0,
        title: (a.title || "").trim(), image: (a.image || "").trim(),
        public: a.public || "", hidden: a.hidden || "",
        reveal: a.reveal === "open" ? "open" : "hidden",
        tags: (a.tags || []).map((t) => t.trim()).filter(Boolean),
        links: (a.links || []).filter((x) => x && x !== a.id),
        updatedAt: Date.now(),
      };
      // 1) мастер-запись ведущей — всегда полная
      await gmRef(campaign, rec.id).set(rec, { merge: true });
      // 2) публичное зеркало — только для открытых; скрытое стирает публичную копию
      if (rec.reveal === "open") await pubRef(campaign, rec.id).set(publicProjection(rec));
      else await pubRef(campaign, rec.id).delete();
      setErr("");
      return true;
    } catch (ex) { setErr(ex.message); return false; }
  }
  async function toggleReveal(a) {
    const next = a.reveal === "open" ? "hidden" : "open";
    if (next === "open" && !confirm("Открыть «" + (a.title || "без названия") + "» партии? Публичная часть станет видна всем игрокам. Скрытый лор [ГМ] останется только у тебя.")) return;
    await saveArtifact({ ...a, reveal: next });
    setErr("");
  }
  async function deleteArtifact(a) {
    if (!confirm("Удалить артефакт «" + (a.title || "без названия") + "»? Действие необратимо. Остальные записи не тронутся.")) return;
    try {
      await gmRef(campaign, a.id).delete();
      await pubRef(campaign, a.id).delete().catch(() => {});
      setErr(""); setView(null); setEditing(null);
    } catch (ex) { setErr(ex.message); }
  }

  /* ── производные: список сессий и меток для фильтров ── */
  const sessions = Array.from(new Set(items.map((a) => a.session || 0))).sort((x, y) => x - y);
  const allTags = Array.from(new Set(items.flatMap((a) => a.tags || []))).sort((x, y) => x.localeCompare(y));

  const filtered = items.filter((a) => {
    if (fType !== "all" && a.type !== fType) return false;
    if (fSession !== "all" && String(a.session || 0) !== String(fSession)) return false;
    if (fTags.length && !fTags.every((t) => (a.tags || []).includes(t))) return false;
    return true;
  }).sort((a, b) => (b.session || 0) - (a.session || 0) || (b.updatedAt || 0) - (a.updatedAt || 0));

  const nextSession = sessions.length ? Math.max(...sessions) : 1;
  const viewed = view ? items.find((a) => a.id === view) : null;

  return (
    <div className="wrap">
      <div className="top">
        <div className="wordmark"><span className="rune">ᛦ</span> Общий инвентарь · {campaign}</div>
        <div className="topacts">
          {isGM && <button className="i-btn accent sm" onClick={() => setEditing("new")}>+ Артефакт</button>}
        </div>
      </div>

      {err && <p className="err">{err}</p>}

      <div className="filters">
        <div className="fgrp">
          <label>Тип</label>
          <select className="i-sel" value={fType} onChange={(e) => setFType(e.target.value)}>
            <option value="all">все типы</option>
            {TYPES.map((t) => <option key={t} value={t}>{TYPE_LABEL[t]}</option>)}
          </select>
        </div>
        <div className="fgrp">
          <label>Сессия</label>
          <select className="i-sel" value={fSession} onChange={(e) => setFSession(e.target.value)}>
            <option value="all">все сессии</option>
            {sessions.map((s) => <option key={s} value={s}>С{s}</option>)}
          </select>
        </div>
        <div className="fgrp" style={{ flex: 2, minWidth: 180 }}>
          <label>Метки</label>
          <div className="tagfilter">
            {allTags.length === 0 ? <span style={{ fontSize: 12, color: "var(--faint)" }}>меток пока нет</span>
              : allTags.map((t) => (
                <span key={t} className={"tagpick" + (fTags.includes(t) ? " on" : "")}
                  onClick={() => setFTags((f) => f.includes(t) ? f.filter((x) => x !== t) : [...f, t])}>{t}</span>
              ))}
            {fTags.length > 0 && <span className="tagpick" onClick={() => setFTags([])} style={{ borderStyle: "dashed" }}>× сброс</span>}
          </div>
        </div>
        <div className="filtersp" />
        <span className="fcount">{filtered.length} из {items.length}</span>
      </div>

      {items.length === 0
        ? <div className="empty">
            {isGM ? <>Инвентарь пуст. Нажми <b>«+ Артефакт»</b>, чтобы завести первый предмет, досье или записку. Новый артефакт по умолчанию скрыт — открой его партии, когда будешь готова.</>
                  : "Партии пока ничего не выдали. Загляни позже."}
          </div>
        : filtered.length === 0
          ? <div className="empty">Ничего не подходит под фильтры.</div>
          : <div className="grid">
              {filtered.map((a) => (
                <GridCard key={a.id} a={a} isGM={isGM} onOpen={() => setView(a.id)} />
              ))}
            </div>}

      {isGM && <p className="hint">
        <b>Дозапись, не замена:</b> каждый артефакт — отдельная запись; добавление нового не трогает остальные, правка обновляет только его.<br />
        <b>Приватность:</b> скрытые артефакты и поля <span style={{ color: "var(--bronze)" }}>[ГМ]</span> лежат в твоём приватном хранилище и в общую партийную коллекцию не попадают, пока ты не нажмёшь «Открыть». Удаление — только за подтверждением.
      </p>}

      {viewed && <ArtifactView a={viewed} all={items} isGM={isGM}
        onClose={() => setView(null)}
        onJump={(id) => setView(id)}
        onEdit={() => { setEditing(viewed); setView(null); }}
        onToggleReveal={() => toggleReveal(viewed)}
        onDelete={() => deleteArtifact(viewed)} />}

      {editing && <ArtifactForm
        initial={editing === "new" ? blankArtifact(nextSession) : editing}
        isNew={editing === "new"}
        all={items}
        onSubmit={async (a) => { const ok = await saveArtifact(a); if (ok) setEditing(null); return ok; }}
        onCancel={() => setEditing(null)}
        onDelete={editing === "new" ? null : () => deleteArtifact(editing)} />}
    </div>
  );
}

/* ── карточка в сетке ── */
function GridCard({ a, isGM, onOpen }) {
  const isHidden = a.reveal !== "open";
  return (
    <div className={"gcard" + (isHidden ? " hidden" : "")} onClick={onOpen}>
      <div className="gthumb">
        {a.image ? <img src={a.image} alt="" loading="lazy" onError={(e) => { e.target.style.display = "none"; }} />
                 : <span className="noimg rune">{TYPE_RUNE[a.type] || "ᛘ"}</span>}
        {isGM && isHidden && <span className="badge hid">скрыто</span>}
      </div>
      <div className="gbody">
        <div className="gtitle">{a.title || "без названия"}</div>
        <div className="gmeta">
          <span className={"ttype " + a.type}>{TYPE_LABEL[a.type] || a.type}</span>
          {a.session ? <span className="gsess">С{a.session}</span> : null}
        </div>
        {(a.tags || []).length ? <div className="gtags">{a.tags.map((t) => <span key={t} className="chip">{t}</span>)}</div> : null}
      </div>
    </div>
  );
}

/* ── просмотр артефакта ── */
function ArtifactView({ a, all, isGM, onClose, onJump, onEdit, onToggleReveal, onDelete }) {
  const isHidden = a.reveal !== "open";
  const fields = TYPE_FIELDS[a.type] || TYPE_FIELDS.item;
  const linked = (a.links || []).map((id) => ({ id, art: all.find((x) => x.id === id) }));
  return (
    <div className="mask" onClick={onClose}>
      <div className="card wide" onClick={(e) => e.stopPropagation()}>
        <div className="vhead">
          <div>
            <h3 className="vtitle">{a.title || "без названия"}</h3>
            <div className="vmeta">
              <span className={"ttype " + a.type}>{TYPE_LABEL[a.type] || a.type}</span>
              {a.session ? <span>сессия {a.session}</span> : null}
              {isGM && <span style={{ color: isHidden ? "var(--bronze)" : "var(--steel)" }}>{isHidden ? "· скрыто от партии" : "· открыто партии"}</span>}
            </div>
          </div>
          <button className="i-btn sm" onClick={onClose}>✕</button>
        </div>

        {a.image ? <img className="vimg" src={a.image} alt="" onError={(e) => { e.target.style.display = "none"; }} /> : null}

        <div className="vsec">
          <h4>{fields.public}</h4>
          <div className="vtext">{(a.public || "").trim() || <span style={{ color: "var(--faint)" }}>— пусто —</span>}</div>
        </div>

        {isGM && (a.hidden || "").trim() ? (
          <div className="vsec">
            <h4 className="gm">{fields.hidden}</h4>
            <div className="gmbox"><div className="vtext">{a.hidden}</div></div>
          </div>
        ) : null}

        {(a.tags || []).length ? (
          <div className="vsec"><h4>Метки</h4><div className="vtags">{a.tags.map((t) => <span key={t} className="chip">{t}</span>)}</div></div>
        ) : null}

        {linked.length ? (
          <div className="vsec">
            <h4>Связи</h4>
            <div className="vlinks">
              {linked.map(({ id, art }) => art
                ? <span key={id} className="linkchip" onClick={() => onJump(id)}>
                    <span className="rune" style={{ fontSize: 12 }}>{TYPE_RUNE[art.type] || "ᛘ"}</span>{art.title || "без названия"}
                  </span>
                : <span key={id} className="linkchip dead" title="артефакт недоступен">— недоступно —</span>)}
            </div>
          </div>
        ) : null}

        {isGM && (
          <div className="row-actions">
            <button className={"revealtoggle" + (!isHidden ? " on" : "")} onClick={onToggleReveal}>
              {isHidden ? "🔒 Открыть партии" : "👁 Открыто — скрыть"}
            </button>
            <div className="sp" />
            <button className="i-btn" onClick={onEdit}>✎ Править</button>
            <button className="i-btn danger" onClick={onDelete}>Удалить</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── форма добавления/правки (только ведущая) ── */
function ArtifactForm({ initial, isNew, all, onSubmit, onCancel, onDelete }) {
  const [type, setType] = useState(initial.type || "item");
  const [session, setSession] = useState(initial.session || 1);
  const [title, setTitle] = useState(initial.title || "");
  const [image, setImage] = useState(initial.image || "");
  const [pub, setPub] = useState(initial.public || "");
  const [hidden, setHidden] = useState(initial.hidden || "");
  const [reveal, setReveal] = useState(initial.reveal === "open" ? "open" : "hidden");
  const [tags, setTags] = useState([...(initial.tags || [])]);
  const [links, setLinks] = useState([...(initial.links || [])]);
  const [tagDraft, setTagDraft] = useState("");
  const [imgOk, setImgOk] = useState(true);
  const [busy, setBusy] = useState(false);
  const [localErr, setLocalErr] = useState("");
  const fields = TYPE_FIELDS[type] || TYPE_FIELDS.item;
  const others = all.filter((x) => x.id !== initial.id);

  useEffect(() => { setImgOk(true); }, [image]);

  const addTag = () => {
    const t = tagDraft.trim();
    if (t && !tags.includes(t)) setTags((l) => [...l, t]);
    setTagDraft("");
  };
  const toggleLink = (id) => setLinks((l) => l.includes(id) ? l.filter((x) => x !== id) : [...l, id]);

  async function submit() {
    if (!title.trim()) { setLocalErr("Впиши " + fields.title.toLowerCase() + "."); return; }
    const s = parseInt(session, 10);
    if (!Number.isInteger(s) || s < 0) { setLocalErr("№ сессии — целое от 0."); return; }
    if (image.trim() && image.trim().length > 5 * 1024 * 1024) { setLocalErr("Ссылка на картинку слишком длинная (>5 МБ). Изображения — только по URL."); return; }
    setBusy(true); setLocalErr("");
    const rec = { id: initial.id, type, session: s, title, image, public: pub, hidden, reveal, tags, links };
    const ok = await onSubmit(rec);
    setBusy(false);
  }

  return (
    <div className="mask" onClick={onCancel}>
      <div className="card" onClick={(e) => e.stopPropagation()}>
        <h3>{isNew ? "Новый артефакт" : "Править артефакт"}</h3>
        <p className="lead">{isNew ? "Заводится скрытым — виден только тебе, пока не откроешь партии." : "Обновится только эта запись; остальные не тронутся."}</p>

        <div className="frow">
          <div className="fcol" style={{ maxWidth: 240 }}>
            <label>Тип</label>
            <div className="seg">
              {TYPES.map((t) => <button key={t} type="button" className={type === t ? "on" : ""} onClick={() => setType(t)}>{TYPE_LABEL[t]}</button>)}
            </div>
          </div>
          <div className="fcol" style={{ maxWidth: 110 }}>
            <label>№ сессии</label>
            <input className="i-input" type="number" min="0" value={session} onChange={(e) => setSession(e.target.value)} />
          </div>
        </div>

        <div className="field">
          <label>{fields.title}</label>
          <input className="i-input" value={title} placeholder={fields.titlePh} autoFocus onChange={(e) => setTitle(e.target.value)} />
        </div>

        <div className="field">
          <label>Изображение — только ссылка (URL), не файл</label>
          <input className="i-input" value={image} placeholder="https://…" onChange={(e) => setImage(e.target.value)} />
          {image.trim() ? (imgOk
            ? <img className="imgprev" src={image} alt="" onError={() => setImgOk(false)} />
            : <div className="imgbad">Картинка не загрузилась — проверь ссылку.</div>) : null}
        </div>

        <div className="field">
          <label>{fields.public}</label>
          <textarea className="i-area" value={pub} placeholder={fields.publicPh} onChange={(e) => setPub(e.target.value)} />
        </div>

        <div className="field">
          <label><span className="gmtag">[ГМ]</span> {fields.hidden} — видно только тебе, даже после открытия</label>
          <textarea className="i-area" value={hidden} placeholder={fields.hiddenPh} onChange={(e) => setHidden(e.target.value)} />
        </div>

        <div className="field">
          <label>Метки</label>
          <div className="tagedit">
            {tags.map((t) => <span key={t} className="tagx">{t}<b onClick={() => setTags((l) => l.filter((x) => x !== t))}>✕</b></span>)}
            <input className="i-input" style={{ maxWidth: 180 }} value={tagDraft} placeholder="+ метка, Enter"
              onChange={(e) => setTagDraft(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addTag(); } }} />
          </div>
        </div>

        {others.length > 0 && (
          <div className="field">
            <label>Связи с другими артефактами</label>
            <div className="linkedit">
              {others.map((o) => (
                <label key={o.id} className="linkrow">
                  <input type="checkbox" checked={links.includes(o.id)} onChange={() => toggleLink(o.id)} />
                  <span className="rune" style={{ fontSize: 12, color: "var(--faint)" }}>{TYPE_RUNE[o.type] || "ᛘ"}</span>
                  {o.title || "без названия"}
                  <span style={{ color: "var(--faint)", fontSize: 11 }}>· {TYPE_LABEL[o.type]}{o.reveal !== "open" ? " · скрыт" : ""}</span>
                </label>
              ))}
            </div>
          </div>
        )}

        <div className="field">
          <label>Видимость</label>
          <div className="seg">
            <button type="button" className={reveal === "hidden" ? "on" : ""} onClick={() => setReveal("hidden")}>🔒 скрыт</button>
            <button type="button" className={reveal === "open" ? "on" : ""} onClick={() => setReveal("open")}>👁 открыт партии</button>
          </div>
        </div>

        {localErr && <p className="err">{localErr}</p>}
        <div className="row-actions">
          <button className="i-btn accent" disabled={busy} onClick={submit}>{isNew ? "Создать" : "Сохранить"}</button>
          <button className="i-btn" onClick={onCancel}>Отмена</button>
          <div className="sp" />
          {onDelete && <button className="i-btn danger" onClick={onDelete}>Удалить</button>}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────── вход ─────────────────────────── */
function Gate({ role, campaign, setCampaign, onPlayer, onGM }) {
  const [code, setCode] = useState(campaign || "");
  const [step, setStep] = useState("code");     // code | gmset | gmenter
  const [pw, setPw] = useState(""); const [pw2, setPw2] = useState("");
  const [hash, setHash] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const norm = (s) => s.trim().toLowerCase().replace(/[^a-zа-я0-9_-]/gi, "");

  async function goCode() {
    if (!HAS_FB || !db) { setErr("Нет конфига Firebase."); return; }
    const c = norm(code); if (!c) { setErr("Введи код кампании."); return; }
    setBusy(true); setErr("");
    try { await auth.signInAnonymously(); } catch (e) { setBusy(false); setErr("Включи Anonymous в Firebase."); return; }
    if (role !== "gm") { setBusy(false); onPlayer(c); return; }
    let h = ""; try { const s = await gmPwRef(c).get(); h = (s.exists && s.data().pwHash) || ""; } catch (e) { setBusy(false); setErr("Нет связи: " + e.message); return; }
    if (!h) { setCode(c); setStep("gmset"); setBusy(false); return; }
    let remembered = ""; try { remembered = localStorage.getItem(gmDeviceKey(c)) || ""; } catch (e) {}
    if (remembered && remembered === h) { setBusy(false); onGM(c); return; }
    setCode(c); setHash(h); setStep("gmenter"); setBusy(false);
  }
  async function gmSet() {
    if (!pw || pw.length < 3) { setErr("Пароль от 3 символов."); return; }
    if (pw !== pw2) { setErr("Пароли не совпадают."); return; }
    const h = await gmHash(code, pw);
    try { await gmPwRef(code).set({ pwHash: h, updatedAt: Date.now() }, { merge: true }); } catch (e) { setErr("Не сохранить: " + e.message); return; }
    try { localStorage.setItem(gmDeviceKey(code), h); } catch (e) {}
    onGM(code);
  }
  async function gmEnter() {
    if (!pw) { setErr("Введи пароль."); return; }
    const h = await gmHash(code, pw);
    if (h !== hash) { setErr("Неверный пароль."); return; }
    try { localStorage.setItem(gmDeviceKey(code), h); } catch (e) {}
    onGM(code);
  }

  const gm = role === "gm";
  return (
    <div className="wrap" style={{ maxWidth: 440, marginTop: 40 }}>
      <div className="card narrow">
        <h3>{gm ? "Общий инвентарь · ведущая" : "Общий инвентарь"}</h3>
        {step === "code" && <React.Fragment>
          <p className="lead">{gm ? "Код кампании и пароль ведущей — те же, что в панели и инициативе." : "Код кампании — увидишь всё, что партии выдали по ходу игры."}</p>
          <div className="field"><label>Код кампании</label><input className="i-input" value={code} autoFocus onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === "Enter" && goCode()} placeholder="например, ragnarok" /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" disabled={busy} onClick={goCode}>{gm ? "Войти" : "Открыть инвентарь"}</button></div>
        </React.Fragment>}

        {step === "gmset" && <React.Fragment>
          <p className="lead">Пароль ведущей ещё не задан для «{code}». Придумай его — он общий для всей панели.</p>
          <div className="field"><label>Новый пароль</label><input className="i-input" type="password" value={pw} autoFocus onChange={(e) => setPw(e.target.value)} /></div>
          <div className="field"><label>Ещё раз</label><input className="i-input" type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && gmSet()} /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" onClick={gmSet}>Задать и войти</button><button className="i-btn" onClick={() => { setStep("code"); setErr(""); }}>Назад</button></div>
        </React.Fragment>}

        {step === "gmenter" && <React.Fragment>
          <p className="lead">Пароль ведущей для «{code}».</p>
          <div className="field"><label>Пароль</label><input className="i-input" type="password" value={pw} autoFocus onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && gmEnter()} /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" onClick={gmEnter}>Войти</button><button className="i-btn" onClick={() => { setStep("code"); setErr(""); }}>Назад</button></div>
        </React.Fragment>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="app-shell.js" defer></script>
</body>
</html>
