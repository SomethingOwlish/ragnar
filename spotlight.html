<style>
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;}
.rune{font-family:var(--rune); line-height:1;}
#root{min-height:100vh;}
.loading{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px;}

.wrap{max-width:880px; margin:0 auto; padding:18px 16px 72px;}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.wordmark{font-family:var(--disp); font-weight:700; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:9px;}
.wordmark .rune{color:var(--bronze); font-size:18px;}
.topacts{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

.i-btn{border:1px solid var(--line); border-radius:9px; padding:7px 13px; font-size:13px; cursor:pointer; background:var(--surf); color:var(--ink); font-family:inherit; transition:border-color var(--dur-1,.14s) var(--ease,ease), color var(--dur-1,.14s) var(--ease,ease), background var(--dur-1,.14s) var(--ease,ease), transform var(--dur-1,.14s) var(--ease,ease);}
.i-btn:hover{background:var(--surf2); border-color:var(--steel-soft);}
.i-btn:active:not(:disabled){transform:translateY(1px);}
.i-btn:disabled{opacity:.45; cursor:not-allowed;}
.i-btn.accent{border-color:var(--bronze-deep); color:var(--bronze);}
.i-btn.accent:hover{background:var(--warm); border-color:var(--bronze);}
.i-btn.danger{border-color:var(--line); color:var(--muted);}
.i-btn.danger:hover{border-color:#a5443a; color:#d8756a; background:rgba(165,68,58,.08);}
.i-btn.sm{padding:5px 10px; font-size:12px;}
.i-input, .i-area, .i-date{background:var(--inset); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:7px 10px; outline:none; font-size:14px; font-family:inherit; width:100%;}
.i-area{min-height:76px; resize:vertical; line-height:1.5;}
.i-input:focus, .i-area:focus, .i-date:focus{border-color:var(--bronze);}

.section{margin-bottom:26px;}
.sechead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 2px 12px; flex-wrap:wrap;}
.sechead h2{font-family:var(--disp); font-size:16px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0; font-weight:700;}
.sechead .sub{font-size:12px; color:var(--faint);}

/* ── доска долга ── */
.board{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px;}
.pc{background:var(--surf); border:1px solid var(--line); border-radius:13px; padding:13px 14px; display:flex; flex-direction:column; gap:9px; transition:border-color var(--dur-1,.14s) var(--ease,ease), background var(--dur-1,.14s) var(--ease,ease);}
.pc.alarm{border-color:#a5443a; background:rgba(165,68,58,.07);}
.pc.pinned{box-shadow:0 0 0 1px var(--bronze-deep) inset;}
.pc-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.pc-name{font-weight:700; font-size:16px; display:flex; align-items:center; gap:7px; min-width:0;}
.pc-name .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.flag{font-size:10px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); border-radius:5px; padding:2px 6px; color:var(--muted); cursor:pointer; background:var(--inset); white-space:nowrap;}
.flag.on{color:#d8756a; border-color:#a5443a; background:rgba(165,68,58,.1);}
.flag.calc{color:#d8756a; border-color:#a5443a; border-style:dashed;}
.metrics{display:flex; gap:16px;}
.metric{display:flex; flex-direction:column; gap:1px;}
.metric .v{font-family:var(--disp); font-weight:700; font-size:24px; line-height:1;}
.metric .v.hot{color:#d8756a;}
.metric .k{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint);}
.spark{display:flex; align-items:center; gap:4px; flex-wrap:wrap; min-height:14px;}
.dot{width:11px; height:11px; border-radius:50%; border:1px solid var(--line); background:transparent;}
.dot.b1{background:var(--steel-soft); border-color:var(--steel);}
.dot.b2{background:var(--bronze); border-color:var(--bronze-deep);}
.dot.na{border-style:dotted; opacity:.4;}

/* ── журнал ── */
.jlist{display:flex; flex-direction:column; gap:8px;}
.jrow{background:var(--surf); border:1px solid var(--line); border-radius:12px; padding:11px 14px;}
.jhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.jnum{font-family:var(--disp); font-weight:700; font-size:17px; color:var(--bronze); min-width:34px;}
.jdate{font-size:12px; color:var(--faint); letter-spacing:.03em;}
.jfocus{display:flex; gap:5px; flex-wrap:wrap;}
.chip{font-size:11px; letter-spacing:.04em; border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--muted);}
.chip.foc{color:var(--bronze); border-color:var(--bronze-deep); background:var(--warm);}
.tiles{display:flex; gap:5px; flex-wrap:wrap; margin-left:auto;}
.tile{display:flex; flex-direction:column; align-items:center; gap:2px;}
.tile .sq{width:26px; height:22px; border-radius:6px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--faint); background:var(--inset);}
.tile .sq.b1{background:var(--steel-soft); border-color:var(--steel); color:var(--ink);}
.tile .sq.b2{background:var(--bronze); border-color:var(--bronze-deep); color:#1a1207;}
.tile .lbl{font-size:9px; letter-spacing:.03em; color:var(--faint); max-width:44px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.jacts{display:flex; align-items:center; gap:6px; margin-left:8px;}
.mini{border:1px solid var(--line); background:var(--inset); color:var(--muted); border-radius:7px; min-width:28px; height:28px; padding:0 8px; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color var(--dur-1,.14s) var(--ease,ease), color var(--dur-1,.14s) var(--ease,ease);}
.mini:hover{border-color:var(--steel-soft); color:var(--ink);}
.mini.x:hover{border-color:#a5443a; color:#d8756a;}
.jbody{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:13.5px; color:var(--ink); line-height:1.6; white-space:pre-wrap;}
.jnotes{margin-top:8px; display:flex; flex-direction:column; gap:3px;}
.jnote{font-size:12px; color:var(--faint);} .jnote b{color:var(--muted); font-weight:600;}

/* ── форма сессии ── */
.formcard{background:var(--surf); border:1px solid var(--line); border-radius:14px; padding:18px;}
.frow{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.fcol{flex:1; min-width:130px;}
.fcol label, .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.03em;}
.pcgrid{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.pcline{display:grid; grid-template-columns:96px auto 1fr; align-items:center; gap:10px;}
.pcline .who{font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.beatseg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.beatseg button{border:none; background:var(--inset); color:var(--muted); padding:6px 11px; font-size:12px; cursor:pointer; font-family:inherit; border-right:1px solid var(--line);}
.beatseg button:last-child{border-right:none;}
.beatseg button.on0{background:var(--surf2); color:var(--ink);}
.beatseg button.on1{background:var(--steel-soft); color:var(--ink);}
.beatseg button.on2{background:var(--bronze); color:#1a1207;}
.focbox{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); cursor:pointer; user-select:none; border:1px solid var(--line); border-radius:6px; padding:3px 8px; background:var(--inset);}
.focbox.on{color:var(--bronze); border-color:var(--bronze-deep); background:var(--warm);}
.notein{background:var(--inset); border:1px solid var(--line); border-radius:7px; color:var(--ink); padding:5px 9px; outline:none; font-size:12.5px; font-family:inherit; width:100%;}
.notein:focus{border-color:var(--bronze);}

.empty{text-align:center; color:var(--faint); font-size:14px; padding:34px 10px; border:1px dashed var(--line); border-radius:12px;}
.hint{font-size:12px; color:var(--faint); margin:14px 2px 0; line-height:1.6;}
.err{color:#d8756a; font-size:13px; margin:8px 0 0;}

/* ── оверлеи ── */
.mask{position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; z-index:60; overflow:auto; animation:sFade var(--dur-2,.22s) var(--ease,ease);}
.card{background:var(--surf); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:560px; box-shadow:var(--shadow-3,0 24px 60px -20px rgba(0,0,0,.7)); animation:sRise .28s var(--ease,ease); margin:auto 0;}
.card.narrow{max-width:420px;}
.card h3{font-family:var(--disp); margin:0 0 4px; font-size:20px; color:var(--ink);}
.card p.lead{color:var(--muted); font-size:13px; margin:0 0 16px;}
.field{margin-bottom:12px;}
.row-actions{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
@keyframes sFade{from{opacity:0;} to{opacity:1;}}
@keyframes sRise{from{opacity:0; transform:translateY(12px) scale(.985);} to{opacity:1; transform:none;}}

.rosterrow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.rosterrow .i-input{flex:1;}

@media (max-width:560px){
  .pcline{grid-template-columns:1fr; gap:6px;}
  .pcline .who{white-space:normal;}
  .tiles{margin-left:0; width:100%;}
  .jhead{gap:8px;}
}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ── тот же конфиг Firebase, что и в остальных кабинетах ── */
const firebaseConfig = {
  apiKey: "AIzaSyCSb7M5IbOql61HIqOUxe3ct4VqdjkhLyE",
  authDomain: "ragnarau-80866.firebaseapp.com",
  projectId: "ragnarau-80866",
  storageBucket: "ragnarau-80866.firebasestorage.app",
  messagingSenderId: "727752765165",
  appId: "1:727752765165:web:8c625b7675f022a1b026e4"
};
const HAS_FB = !!(window.firebase && firebaseConfig.apiKey);
let db = null, auth = null;
if (HAS_FB) { try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); db = firebase.firestore(); auth = firebase.auth(); } catch (e) { console.error(e); } }

/* ── пароль ведущей: та же схема, что в панели и инициативе ── */
async function gmHash(campaign, pw) {
  const data = new TextEncoder().encode("ragnarok:" + campaign + ":" + pw);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
const gmPwRef = (c) => db.collection("campaigns").doc(c).collection("config").doc("gm");
const gmDeviceKey = (c) => "ragnarok-gmpw-" + c;

/* ── ключ-на-сущность, дозапись: сессии — по одному документу на номер ── */
const spotRoot   = (c) => db.collection("campaigns").doc(c).collection("spotlight");
const rosterRef  = (c) => spotRoot(c).doc("roster");
const settingsRef= (c) => spotRoot(c).doc("settings");
const sessionsCol= (c) => db.collection("campaigns").doc(c).collection("spotlightSessions");
const sessionRef = (c, n) => sessionsCol(c).doc(String(n));

const qp = new URLSearchParams(location.search);
function initialCampaign() {
  const fromUrl = (qp.get("c") || "").trim();
  if (fromUrl) return fromUrl.toLowerCase();
  try { const cur = JSON.parse(localStorage.getItem("ragnarok-current") || "null"); if (cur && cur.campaign) return cur.campaign; } catch (e) {}
  try { return (localStorage.getItem("ragnarok-board-campaign") || localStorage.getItem("ragnarok-campaign") || "").toLowerCase(); } catch (e) { return ""; }
}

/* ── ростер по умолчанию (редактируемый) ── */
const DEFAULT_ROSTER = [
  { id: "ulla",  name: "Улла",  hidden: false },
  { id: "lars",  name: "Ларс",  hidden: false },
  { id: "egil",  name: "Эгиль", hidden: false },
  { id: "froya", name: "Фроя",  hidden: false },
  { id: "stig",  name: "Стиг",  hidden: false },
];
const DEFAULT_SETTINGS = { window: 4, bitThreshold: 4, focusThreshold: 3, manualFlags: {} };

const BEAT_LABEL = { 0: "нет", 1: "малый", 2: "крупный" };
const todayISO = () => { try { return new Date().toISOString().slice(0, 10); } catch (e) { return ""; } };

/* ── расчёт долга по всем накопленным записям (агрегаты не хранятся) ── */
function computeDebts(pcs, sessions, settings) {
  const W = settings.window > 0 ? settings.window : Infinity;
  const sorted = [...sessions].sort((a, b) => a.number - b.number);
  const total = sorted.length;
  const win = W === Infinity ? sorted : sorted.slice(-W);
  return pcs.map((pc) => {
    let bit = 0, counted = 0;
    win.forEach((s) => {
      const b = s.beats ? s.beats[pc.id] : undefined;
      if (b === 0 || b === 1 || b === 2) { bit += (2 - b); counted++; }
    });
    let lastFocus = null;
    sorted.forEach((s) => { if (Array.isArray(s.focus) && s.focus.includes(pc.id)) lastFocus = s.number; });
    const focus = lastFocus === null ? total : sorted.filter((s) => s.number > lastFocus).length;
    return { pc, bit: Math.round(bit), focus: Math.round(focus), counted };
  });
}
/* флаг «вытащить»: ручной override поверх расчёта */
function flagState(pcId, calcAlarm, manualFlags) {
  const m = manualFlags ? manualFlags[pcId] : undefined;
  if (m === true) return { on: true, manual: true };
  if (m === false) return { on: false, manual: true };
  return { on: calcAlarm, manual: false };
}

/* ─────────────────────────── приложение ─────────────────────────── */
function App() {
  const role = qp.get("role") === "gm" ? "gm" : (qp.get("role") ? "player" : "gm");
  const [campaign, setCampaign] = useState(initialCampaign());
  const [joined, setJoined] = useState(false);
  const [roster, setRoster] = useState(null);       // null = ещё грузим
  const [settings, setSettings] = useState(null);
  const [sessions, setSessions] = useState(null);
  const [err, setErr] = useState("");
  const [editing, setEditing] = useState(null);     // запись для правки (модалка)
  const [showRoster, setShowRoster] = useState(false);
  const [showSettings, setShowSettings] = useState(false);

  /* живой ростер (с фолбэком на умолчание) */
  useEffect(() => {
    if (!joined || !db || !campaign) return;
    const unsub = rosterRef(campaign).onSnapshot(
      (snap) => { const d = snap.exists ? snap.data() : null; setRoster(d && Array.isArray(d.pcs) && d.pcs.length ? d.pcs : DEFAULT_ROSTER); },
      (e) => { setErr("Чтение ростера: " + e.message); setRoster(DEFAULT_ROSTER); }
    );
    return () => unsub();
  }, [joined, campaign]);

  /* живые настройки */
  useEffect(() => {
    if (!joined || !db || !campaign) return;
    const unsub = settingsRef(campaign).onSnapshot(
      (snap) => { const d = snap.exists ? snap.data() : null; setSettings({ ...DEFAULT_SETTINGS, ...(d || {}), manualFlags: (d && d.manualFlags) || {} }); },
      (e) => { setErr("Чтение настроек: " + e.message); setSettings(DEFAULT_SETTINGS); }
    );
    return () => unsub();
  }, [joined, campaign]);

  /* живой журнал сессий */
  useEffect(() => {
    if (!joined || !db || !campaign) return;
    const unsub = sessionsCol(campaign).onSnapshot(
      (qs) => { const a = []; qs.forEach((d) => { const r = d.data(); if (r && typeof r.number === "number") a.push(r); }); setSessions(a); },
      (e) => { setErr("Чтение журнала: " + e.message); setSessions([]); }
    );
    return () => unsub();
  }, [joined, campaign]);

  if (!joined) return <Gate role={role} campaign={campaign} setCampaign={setCampaign} onGM={(c) => { setCampaign(c); setJoined(true); }} />;

  const loading = roster === null || settings === null || sessions === null;
  if (loading) return <div className="loading">Считаем долг…</div>;

  const visiblePcs = roster.filter((p) => !p.hidden);
  const sortedSessions = [...sessions].sort((a, b) => b.number - a.number);
  const nextNumber = sessions.length ? Math.max(...sessions.map((s) => s.number)) + 1 : 1;

  /* ── запись данных: try/catch, дозапись без затирания соседей ── */
  async function saveSession(rec, prevNumber) {
    try {
      // при смене номера в правке — переносим документ, старый удаляем
      if (prevNumber != null && prevNumber !== rec.number) {
        if (sessions.some((s) => s.number === rec.number)) throw new Error("Сессия №" + rec.number + " уже есть.");
        await sessionRef(campaign, rec.number).set({ ...rec, updatedAt: Date.now() });
        await sessionRef(campaign, prevNumber).delete();
      } else {
        if (prevNumber == null && sessions.some((s) => s.number === rec.number)) throw new Error("Сессия №" + rec.number + " уже есть. Правь её в журнале.");
        await sessionRef(campaign, rec.number).set({ ...rec, updatedAt: Date.now() }, { merge: prevNumber != null });
      }
      setErr("");
      return true;
    } catch (ex) { setErr(ex.message); return false; }
  }
  async function deleteSession(n) {
    if (!confirm("Удалить сессию №" + n + "? Действие необратимо. Остальные записи не тронутся.")) return;
    try { await sessionRef(campaign, n).delete(); setErr(""); } catch (ex) { setErr(ex.message); }
  }
  async function saveRoster(pcs) { try { await rosterRef(campaign).set({ pcs, updatedAt: Date.now() }, { merge: true }); setErr(""); return true; } catch (ex) { setErr(ex.message); return false; } }
  async function patchSettings(obj) { try { await settingsRef(campaign).set({ ...obj, updatedAt: Date.now() }, { merge: true }); setErr(""); return true; } catch (ex) { setErr(ex.message); return false; } }
  async function toggleFlag(pcId, calcAlarm) {
    const cur = flagState(pcId, calcAlarm, settings.manualFlags);
    const mf = { ...settings.manualFlags };
    // цикл: расчёт → закрепить вкл → закрепить выкл → снова расчёт
    if (!cur.manual) mf[pcId] = !calcAlarm ? true : false;
    else if (mf[pcId] === true) mf[pcId] = false;
    else delete mf[pcId];
    await patchSettings({ manualFlags: mf });
  }
  async function seed() {
    if (!confirm("Заложить стартовый сид С1–С2? Создадутся записи сессий 1 и 2 (Эгиль и Ларс — крупный бит, прочие — нет). Существующие записи не тронутся.")) return;
    const focus = ["egil", "lars"];
    const beats = {}; roster.forEach((p) => { beats[p.id] = (p.id === "egil" || p.id === "lars") ? 2 : 0; });
    try {
      for (const n of [1, 2]) {
        if (sessions.some((s) => s.number === n)) continue;
        await sessionRef(campaign, n).set({ number: n, date: "", focus, beats: { ...beats }, notes: {}, summary: "Стартовый сид: экран тянули Эгиль и Ларс.", updatedAt: Date.now() });
      }
      setErr("");
    } catch (ex) { setErr(ex.message); }
  }

  const debts = computeDebts(visiblePcs, sessions, settings);
  const boardOrder = [...debts].sort((a, b) => (b.bit - a.bit) || (b.focus - a.focus) || a.pc.name.localeCompare(b.pc.name));
  const SPARK_N = 8;
  const sparkSessions = [...sessions].sort((a, b) => a.number - b.number).slice(-SPARK_N);

  return (
    <div className="wrap">
      <div className="top">
        <div className="wordmark"><span className="rune">ᛉ</span> Спотлайт-трекер · {campaign}</div>
        <div className="topacts">
          <button className="i-btn sm" onClick={() => setShowRoster(true)}>Ростер</button>
          <button className="i-btn sm" onClick={() => setShowSettings(true)}>Настройки</button>
        </div>
      </div>

      {err && <p className="err">{err}</p>}

      {/* ── 1. Доска долга ── */}
      <div className="section">
        <div className="sechead">
          <h2>Доска долга</h2>
          <span className="sub">окно {settings.window > 0 ? settings.window + " сес." : "всё время"} · порог бит ≥ {settings.bitThreshold} или фокус ≥ {settings.focusThreshold}</span>
        </div>
        {visiblePcs.length === 0
          ? <div className="empty">Ростер пуст. Открой «Ростер» и добавь героев.</div>
          : <div className="board">
              {boardOrder.map(({ pc, bit, focus }) => {
                const calcAlarm = bit >= settings.bitThreshold || focus >= settings.focusThreshold;
                const fl = flagState(pc.id, calcAlarm, settings.manualFlags);
                return (
                  <div key={pc.id} className={"pc" + (fl.on ? " alarm" : "") + (fl.manual && fl.on ? " pinned" : "")}>
                    <div className="pc-top">
                      <div className="pc-name"><span className="nm">{pc.name}</span></div>
                      <button
                        className={"flag" + (fl.on ? (fl.manual ? " on" : " calc") : "")}
                        title={fl.manual ? "закреплено вручную — нажми, чтобы сменить" : "по расчёту — нажми, чтобы закрепить/снять"}
                        onClick={() => toggleFlag(pc.id, calcAlarm)}>
                        {fl.on ? "вытащить" : "ок"}{fl.manual ? " ✓" : ""}
                      </button>
                    </div>
                    <div className="metrics">
                      <div className="metric"><span className={"v" + (bit >= settings.bitThreshold ? " hot" : "")}>{bit}</span><span className="k">бит-долг</span></div>
                      <div className="metric"><span className={"v" + (focus >= settings.focusThreshold ? " hot" : "")}>{focus}</span><span className="k">фокус-долг</span></div>
                    </div>
                    <div className="spark" title="бит по последним сессиям">
                      {sparkSessions.length === 0
                        ? <span style={{ fontSize: 11, color: "var(--faint)" }}>нет записей</span>
                        : sparkSessions.map((s) => {
                            const b = s.beats ? s.beats[pc.id] : undefined;
                            const cls = b === 2 ? "b2" : b === 1 ? "b1" : (b === 0 ? "" : "na");
                            return <span key={s.number} className={"dot " + cls} title={"С" + s.number + ": " + (b === undefined ? "нет данных" : BEAT_LABEL[b])} />;
                          })}
                    </div>
                  </div>
                );
              })}
            </div>}
      </div>

      {/* ── 2. Журнал сессий ── */}
      <div className="section">
        <div className="sechead">
          <h2>Журнал сессий</h2>
          <span className="sub">{sessions.length} {sessions.length === 1 ? "запись" : "записей"} · новая сверху</span>
        </div>
        {sessions.length === 0
          ? <div className="empty">
              Ещё нет записей. Занеси первую сессию ниже — или{" "}
              <button className="i-btn sm" style={{ marginLeft: 4 }} onClick={seed}>заложить стартовый сид С1–С2</button>
            </div>
          : <div className="jlist">
              {sortedSessions.map((s) => (
                <JournalRow key={s.number} s={s} pcs={visiblePcs} onEdit={() => setEditing(s)} onDelete={() => deleteSession(s.number)} />
              ))}
            </div>}
      </div>

      {/* ── 3. Добавить сессию ── */}
      <div className="section">
        <div className="sechead"><h2>Добавить сессию</h2><span className="sub">новая запись — ничего не затирает</span></div>
        <SessionForm key={"add-" + nextNumber + "-" + visiblePcs.length} pcs={visiblePcs} defaultNumber={nextNumber} onSubmit={(rec) => saveSession(rec, null)} />
      </div>

      <p className="hint">
        <b>Долг считается на лету</b> по всем накопленным записям — нигде не хранится. Бит-долг — по последним {settings.window > 0 ? settings.window : "∞"} сессиям (вклад: нет +2, малый +1, крупный +0). Фокус-долг — сколько сессий PC не попадал в план фокуса.<br />
        Флаг «вытащить» — подсказка, а не приговор: жми по нему, чтобы закрепить (✓) или снять поверх расчёта. Удаление и сброс — только за подтверждением.
      </p>

      {editing && <div className="mask" onClick={() => setEditing(null)}>
        <div className="card" onClick={(e) => e.stopPropagation()}>
          <h3>Править сессию №{editing.number}</h3>
          <p className="lead">Обновится только эта запись. Долг пересчитается сам.</p>
          <SessionForm pcs={visiblePcs} initial={editing} allNumbers={sessions.map((s) => s.number)}
            onSubmit={async (rec) => { const ok = await saveSession(rec, editing.number); if (ok) setEditing(null); return ok; }}
            onCancel={() => setEditing(null)} />
        </div>
      </div>}

      {showRoster && <RosterEditor pcs={roster} onSave={saveRoster} onClose={() => setShowRoster(false)} />}
      {showSettings && <SettingsPanel settings={settings} onSave={patchSettings} onClose={() => setShowSettings(false)} />}
    </div>
  );
}

/* ── строка журнала ── */
function JournalRow({ s, pcs, onEdit, onDelete }) {
  const [open, setOpen] = useState(false);
  const focusNames = (s.focus || []).map((id) => (pcs.find((p) => p.id === id) || {}).name).filter(Boolean);
  const notes = s.notes || {};
  const noteList = pcs.filter((p) => (notes[p.id] || "").trim());
  const hasBody = (s.summary || "").trim() || noteList.length;
  return (
    <div className="jrow">
      <div className="jhead">
        <span className="jnum">С{s.number}</span>
        {s.date ? <span className="jdate">{s.date}</span> : null}
        <div className="jfocus">
          {focusNames.length ? focusNames.map((n) => <span key={n} className="chip foc">◎ {n}</span>) : <span className="chip">без плана фокуса</span>}
        </div>
        <div className="tiles">
          {pcs.map((p) => {
            const b = s.beats ? s.beats[p.id] : undefined;
            const cls = b === 2 ? "b2" : b === 1 ? "b1" : "";
            return (
              <div key={p.id} className="tile" title={p.name + ": " + (b === undefined ? "нет данных" : BEAT_LABEL[b])}>
                <span className={"sq " + cls}>{b === undefined ? "·" : b}</span>
                <span className="lbl">{p.name}</span>
              </div>
            );
          })}
        </div>
        <div className="jacts">
          {hasBody ? <button className="mini" title="свод" onClick={() => setOpen((v) => !v)}>{open ? "▲" : "свод"}</button> : null}
          <button className="mini" title="править" onClick={onEdit}>✎</button>
          <button className="mini x" title="удалить" onClick={onDelete}>✕</button>
        </div>
      </div>
      {open && hasBody && <div className="jbody">
        {(s.summary || "").trim() ? s.summary : null}
        {noteList.length ? <div className="jnotes">{noteList.map((p) => <div key={p.id} className="jnote"><b>{p.name}:</b> {notes[p.id]}</div>)}</div> : null}
      </div>}
    </div>
  );
}

/* ── форма записи (добавление и правка) ── */
function SessionForm({ pcs, defaultNumber, initial, allNumbers, onSubmit, onCancel }) {
  const mk0 = () => { const o = {}; pcs.forEach((p) => { o[p.id] = 0; }); return o; };
  const [number, setNumber] = useState(initial ? initial.number : (defaultNumber || 1));
  const [date, setDate] = useState(initial ? (initial.date || "") : todayISO());
  const [focus, setFocus] = useState(initial ? [...(initial.focus || [])] : []);
  const [beats, setBeats] = useState(() => { const b = mk0(); if (initial && initial.beats) pcs.forEach((p) => { if (initial.beats[p.id] != null) b[p.id] = initial.beats[p.id]; }); return b; });
  const [notes, setNotes] = useState(() => { const n = {}; pcs.forEach((p) => { n[p.id] = (initial && initial.notes && initial.notes[p.id]) || ""; }); return n; });
  const [summary, setSummary] = useState(initial ? (initial.summary || "") : "");
  const [busy, setBusy] = useState(false);
  const [localErr, setLocalErr] = useState("");

  const toggleFocus = (id) => setFocus((f) => f.includes(id) ? f.filter((x) => x !== id) : [...f, id]);
  const setBeat = (id, v) => setBeats((b) => ({ ...b, [id]: v }));

  async function submit() {
    const n = parseInt(number, 10);
    if (!Number.isInteger(n) || n < 1) { setLocalErr("Номер сессии — целое от 1."); return; }
    if (allNumbers && n !== initial.number && allNumbers.includes(n)) { setLocalErr("Сессия №" + n + " уже есть."); return; }
    setBusy(true); setLocalErr("");
    const rec = { number: n, date: date || "", focus: [...focus], beats: { ...beats }, notes: { ...notes }, summary: summary || "" };
    const ok = await onSubmit(rec);
    setBusy(false);
    if (ok && !initial) { setFocus([]); setBeats(mk0()); setNotes({}); setSummary(""); setNumber(n + 1); setDate(todayISO()); }
  }

  return (
    <div className={initial ? "" : "formcard"}>
      <div className="frow">
        <div className="fcol" style={{ maxWidth: 120 }}><label>№ сессии</label><input className="i-input" type="number" min="1" value={number} onChange={(e) => setNumber(e.target.value)} /></div>
        <div className="fcol" style={{ maxWidth: 190 }}><label>Дата</label><input className="i-date" type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>
        <div className="fcol" style={{ display: "flex", alignItems: "flex-end" }}>
          <span style={{ fontSize: 12, color: "var(--faint)" }}>Фокус — обычно 2 PC. Отметь их ниже галкой ◎.</span>
        </div>
      </div>

      <div className="pcgrid">
        {pcs.map((p) => (
          <div key={p.id} className="pcline">
            <span className="who">{p.name}</span>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span className={"focbox" + (focus.includes(p.id) ? " on" : "")} onClick={() => toggleFocus(p.id)}>◎ фокус</span>
              <span className="beatseg">
                {[0, 1, 2].map((v) => (
                  <button key={v} type="button" className={beats[p.id] === v ? "on" + v : ""} onClick={() => setBeat(p.id, v)}>{BEAT_LABEL[v]}</button>
                ))}
              </span>
            </div>
            <input className="notein" placeholder="пометка по биту (необяз.)" value={notes[p.id] || ""} onChange={(e) => setNotes((n) => ({ ...n, [p.id]: e.target.value }))} />
          </div>
        ))}
      </div>

      <div className="field"><label>Свод сессии — сюда вставляется текст от Claude</label><textarea className="i-area" value={summary} onChange={(e) => setSummary(e.target.value)} placeholder="Что произошло за сессию; черновая оценка бита по каждому PC…" /></div>

      {localErr && <p className="err">{localErr}</p>}
      <div className="row-actions">
        <button className="i-btn accent" disabled={busy} onClick={submit}>{initial ? "Сохранить" : "Добавить запись"}</button>
        {onCancel && <button className="i-btn" onClick={onCancel}>Отмена</button>}
      </div>
    </div>
  );
}

/* ── редактор ростера ── */
function RosterEditor({ pcs, onSave, onClose }) {
  const [list, setList] = useState(pcs.map((p) => ({ ...p })));
  const [busy, setBusy] = useState(false);
  const genId = () => "pc" + Math.random().toString(36).slice(2, 8);
  const add = () => setList((l) => [...l, { id: genId(), name: "", hidden: false }]);
  const rename = (i, v) => setList((l) => l.map((p, j) => j === i ? { ...p, name: v } : p));
  const toggleHide = (i) => setList((l) => l.map((p, j) => j === i ? { ...p, hidden: !p.hidden } : p));
  const remove = (i) => setList((l) => l.filter((_, j) => j !== i));
  async function save() {
    const clean = list.map((p) => ({ id: p.id, name: (p.name || "").trim() || "PC", hidden: !!p.hidden }));
    setBusy(true); const ok = await onSave(clean); setBusy(false); if (ok) onClose();
  }
  return (
    <div className="mask" onClick={onClose}>
      <div className="card narrow" onClick={(e) => e.stopPropagation()}>
        <h3>Ростер</h3>
        <p className="lead">Добавить, переименовать или скрыть выбывшего. Скрытые не считаются в долге, но их записи в журнале сохраняются.</p>
        {list.map((p, i) => (
          <div key={p.id} className="rosterrow">
            <input className="i-input" value={p.name} placeholder="имя PC" onChange={(e) => rename(i, e.target.value)} style={p.hidden ? { opacity: .5 } : null} />
            <button className="mini" title={p.hidden ? "показать" : "скрыть"} onClick={() => toggleHide(i)}>{p.hidden ? "🙈" : "👁"}</button>
            <button className="mini x" title="удалить из ростера" onClick={() => remove(i)}>✕</button>
          </div>
        ))}
        <div className="row-actions">
          <button className="i-btn" onClick={add}>+ PC</button>
          <button className="i-btn accent" disabled={busy} onClick={save}>Сохранить</button>
          <button className="i-btn" onClick={onClose}>Закрыть</button>
        </div>
      </div>
    </div>
  );
}

/* ── настройки: окно, пороги ── */
function SettingsPanel({ settings, onSave, onClose }) {
  const [win, setWin] = useState(settings.window);
  const [bit, setBit] = useState(settings.bitThreshold);
  const [foc, setFoc] = useState(settings.focusThreshold);
  const [allTime, setAllTime] = useState(!(settings.window > 0));
  const [busy, setBusy] = useState(false);
  async function save() {
    setBusy(true);
    const ok = await onSave({ window: allTime ? 0 : Math.max(1, parseInt(win, 10) || 4), bitThreshold: Math.max(0, parseInt(bit, 10) || 0), focusThreshold: Math.max(0, parseInt(foc, 10) || 0) });
    setBusy(false); if (ok) onClose();
  }
  return (
    <div className="mask" onClick={onClose}>
      <div className="card narrow" onClick={(e) => e.stopPropagation()}>
        <h3>Настройки</h3>
        <p className="lead">Окно бит-долга и пороги тревоги. Ручные флаги «вытащить» ставятся прямо на доске.</p>
        <div className="field">
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
            <input type="checkbox" checked={allTime} onChange={(e) => setAllTime(e.target.checked)} /> считать за всё время (без окна)
          </label>
        </div>
        {!allTime && <div className="field"><label>Окно W — сколько последних сессий в бит-долге</label><input className="i-input" type="number" min="1" value={win} onChange={(e) => setWin(e.target.value)} /></div>}
        <div className="field"><label>Порог бит-долга (красный при ≥)</label><input className="i-input" type="number" min="0" value={bit} onChange={(e) => setBit(e.target.value)} /></div>
        <div className="field"><label>Порог фокус-долга (красный при ≥)</label><input className="i-input" type="number" min="0" value={foc} onChange={(e) => setFoc(e.target.value)} /></div>
        <div className="row-actions">
          <button className="i-btn accent" disabled={busy} onClick={save}>Сохранить</button>
          <button className="i-btn" onClick={onClose}>Закрыть</button>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────── вход (только ведущая) ─────────────────────────── */
function Gate({ role, campaign, setCampaign, onGM }) {
  const [code, setCode] = useState(campaign || "");
  const [step, setStep] = useState("code");     // code | gmset | gmenter
  const [pw, setPw] = useState(""); const [pw2, setPw2] = useState("");
  const [hash, setHash] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const norm = (s) => s.trim().toLowerCase().replace(/[^a-zа-я0-9_-]/gi, "");

  async function goCode() {
    if (!HAS_FB || !db) { setErr("Нет конфига Firebase."); return; }
    const c = norm(code); if (!c) { setErr("Введи код кампании."); return; }
    setBusy(true); setErr("");
    try { await auth.signInAnonymously(); } catch (e) { setBusy(false); setErr("Включи Anonymous в Firebase."); return; }
    let h = ""; try { const s = await gmPwRef(c).get(); h = (s.exists && s.data().pwHash) || ""; } catch (e) { setBusy(false); setErr("Нет связи: " + e.message); return; }
    if (!h) { setCode(c); setStep("gmset"); setBusy(false); return; }
    let remembered = ""; try { remembered = localStorage.getItem(gmDeviceKey(c)) || ""; } catch (e) {}
    if (remembered && remembered === h) { setBusy(false); onGM(c); return; }
    setCode(c); setHash(h); setStep("gmenter"); setBusy(false);
  }
  async function gmSet() {
    if (!pw || pw.length < 3) { setErr("Пароль от 3 символов."); return; }
    if (pw !== pw2) { setErr("Пароли не совпадают."); return; }
    const h = await gmHash(code, pw);
    try { await gmPwRef(code).set({ pwHash: h, updatedAt: Date.now() }, { merge: true }); } catch (e) { setErr("Не сохранить: " + e.message); return; }
    try { localStorage.setItem(gmDeviceKey(code), h); } catch (e) {}
    onGM(code);
  }
  async function gmEnter() {
    if (!pw) { setErr("Введи пароль."); return; }
    const h = await gmHash(code, pw);
    if (h !== hash) { setErr("Неверный пароль."); return; }
    try { localStorage.setItem(gmDeviceKey(code), h); } catch (e) {}
    onGM(code);
  }

  return (
    <div className="wrap" style={{ maxWidth: 440, marginTop: 40 }}>
      <div className="card narrow">
        <h3>Спотлайт-трекер · ведущая</h3>
        {step === "code" && <React.Fragment>
          <p className="lead">Инструмент только для ведущей. Код кампании и пароль ведущей — те же, что в панели и инициативе.</p>
          <div className="field"><label>Код кампании</label><input className="i-input" value={code} autoFocus onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === "Enter" && goCode()} placeholder="например, ragnarok" /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" disabled={busy} onClick={goCode}>Войти</button></div>
        </React.Fragment>}

        {step === "gmset" && <React.Fragment>
          <p className="lead">Пароль ведущей ещё не задан для «{code}». Придумай его — он общий для всей панели.</p>
          <div className="field"><label>Новый пароль</label><input className="i-input" type="password" value={pw} autoFocus onChange={(e) => setPw(e.target.value)} /></div>
          <div className="field"><label>Ещё раз</label><input className="i-input" type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && gmSet()} /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" onClick={gmSet}>Задать и войти</button><button className="i-btn" onClick={() => { setStep("code"); setErr(""); }}>Назад</button></div>
        </React.Fragment>}

        {step === "gmenter" && <React.Fragment>
          <p className="lead">Пароль ведущей для «{code}».</p>
          <div className="field"><label>Пароль</label><input className="i-input" type="password" value={pw} autoFocus onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && gmEnter()} /></div>
          {err && <p className="err">{err}</p>}
          <div className="row-actions"><button className="i-btn accent" onClick={gmEnter}>Войти</button><button className="i-btn" onClick={() => { setStep("code"); setErr(""); }}>Назад</button></div>
        </React.Fragment>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="app-shell.js" defer></script>
